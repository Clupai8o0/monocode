<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Four interactive MonoCode sidebar layouts with 16 projects and 64 sample sessions.">
  <title>MonoCode — project sidebar studies</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #e5e5e5; background: #101010; font-synthesis: none; --shell: #181818; --panel: #101010; --raised: #242424; --line: #ffffff0e; --muted: #999; --blue: #69adf4; --amber: #e7bc72; --green: #8cc8aa; }
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px 28px 88px; }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; color: inherit; border: 0; background: transparent; }
    button, select { transition: background-color 140ms ease-out, color 140ms ease-out; }
    button:hover { background: #ffffff0b; }
    button:active { transform: translateY(1px); }
    button:disabled { opacity: .35; cursor: default; transform: none; }
    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    input, textarea { color: inherit; }
    select { color: #c1c9d3; background: #1b222b; border: 1px solid #ffffff12; border-radius: 6px; padding: 6px 10px; }
    .study-head { max-width: 1440px; margin: 0 auto 18px; display: flex; align-items: center; gap: 24px; justify-content: space-between; }
    .study-label { font-size: 11px; color: #91a0b2; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; }
    h1 { font-size: 21px; letter-spacing: -.5px; margin: 0; font-weight: 600; }

    .study-copy strong { color: #d0d8e2; font-weight: 500; }
    .study-controls { display: flex; align-items: center; flex-wrap: wrap; justify-content: flex-end; gap: 12px; font-size: 12px; }
    .study-controls label { display: flex; align-items: center; gap: 8px; white-space: nowrap; color: var(--muted); }
    .study-controls .simulate-run { padding: 6px 9px; border: 1px solid #ffffff16; border-radius: 6px; color: #aab8c8; font-size: 11px; }
    .demo-label { color: #8c99a8; font-size: 11px; padding-left: 12px; border-left: 1px solid #ffffff18; white-space: nowrap; }
    #stage { max-width: 1440px; margin: auto; }
    .app { height: max(550px, calc(100dvh - 244px)); max-height: 950px; border: 1px solid #444; border-radius: 15px; background: var(--shell); overflow: hidden; isolation: isolate; display: grid; grid-template-rows: 42px minmax(0, 1fr) 38px; }
    .app.laptop { max-width: 1080px; margin: auto; }
    .titlebar { display: flex; align-items: center; gap: 8px; padding: 0 14px; color: #8a95a2; font-size: 12px; }

    .toolbar-glyph { width: 24px; display: grid; place-items: center; font-size: 17px; }
    .tab { display: flex; align-items: center; gap: 8px; background: #ffffff05; padding: 8px 12px; border-radius: 7px; max-width: 310px; color: #bcc5cf; margin-left: 12px; overflow: hidden; }
    .tab span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .tab .close { margin-left: 18px; opacity: .45; }
    .title-caption { margin-left: auto; font-size: 11px; color: #768391; }
    .body { display: grid; grid-template-columns: 308px minmax(0,1fr); min-height: 0; padding: 0 8px 0 0; }
    .tree .body { grid-template-columns: 324px minmax(0,1fr); }
    .activity .body { grid-template-columns: 336px minmax(0,1fr); }
    .sidebar { min-height: 0; min-width: 0; display: flex; flex-direction: column; padding: 0 8px; }
    .side-title { display: flex; gap: 9px; align-items: center; padding: 9px 8px 14px; font-size: 15px; font-weight: 600; }
    .side-title .subtle { margin-left: auto; font-size: 11px; font-weight: 400; }
    .mascot { width: 18px; height: 18px; flex: 0 0 18px; display: inline-block; }
    .mascot-bg { width: 26px; height: 26px; flex: 0 0 26px; display: grid; place-items: center; border-radius: 6px; background: #ffffff07; }
    .brand-identity { width: 20px; height: 20px; position: relative; flex: 0 0 20px; }
    .brand-identity > svg, .brand-working { position: absolute; inset: 0; width: 100%; height: 100%; }
    .brand-working { display: grid; place-items: center; }
    .brand-identity.running > svg { animation: brand-fade 6s ease-in-out infinite; }
    .brand-identity.running .brand-working { animation: ghost-fade 6s ease-in-out infinite; }
    @keyframes brand-fade { 0%,45%,100% { opacity: 1; } 50%,95% { opacity: 0; } }
    @keyframes ghost-fade { 0%,45%,100% { opacity: 0; } 50%,95% { opacity: 1; } }
    .page-hidden .brand-identity * { animation-play-state: paused !important; }
    @media (prefers-reduced-motion: reduce) { .brand-identity.running > svg { animation: none; } .brand-working { display: none; } }
    .search { display: flex; align-items: center; gap: 8px; margin: 0 6px 10px; padding: 8px 9px; background: #ffffff03; border: 1px solid #ffffff0e; border-radius: 7px; color: #788694; }
    .search input { min-width: 0; width: 100%; background: transparent; border: 0; padding: 0; outline: none; font-size: 12px; }
    .search:focus-within { border-color: #69adf47a; }
    input::placeholder, textarea::placeholder { color: #788694; }
    .search kbd { color: #667381; font: inherit; font-size: 11px; white-space: nowrap; }
    .summary { display: grid; grid-template-columns: repeat(3,1fr); gap: 4px; padding: 0 6px 12px; }

    .project-list { flex: 1; min-height: 120px; }
    .watchlist .body { grid-template-columns: 260px minmax(0,1fr); }

    .native-projects-head { display: flex; align-items: center; gap: 4px; height: 28px; flex-shrink: 0; padding: 0 8px; color: #ffffff80; font-size: 12px; font-weight: 500; }
    .native-projects-head > span { flex: 1; }
    .native-icon-button { position: relative; display: grid; width: 28px; height: 28px; flex-shrink: 0; place-items: center; padding: 0; border-radius: 6px; color: #ffffff73; }
    .native-icon-button svg { width: 14px; height: 14px; }
    .notification-count { position: absolute; top: -2px; right: -2px; min-width: 14px; padding: 0 2px; border-radius: 4px; font-size: 9px; line-height: 14px; font-weight: 600; color: #493600; background: #fbbf24; }
    .watchlist .project-list { flex: 1; min-height: 0; }
    .native-project-item { display: flex; align-items: center; height: 32px; border-radius: 6px; }
    .native-project-item:hover { background: #ffffff0d; }
    .native-project-item.active { background: #ffffff1a; }
    .watchlist .project-row { align-items: center; gap: 8px; height: 32px; padding: 0 8px; margin: 0; flex: 1; min-width: 0; border-radius: 6px; }
    .watchlist .project-row.active { background: transparent; }
    .watchlist .project-row.active::before { display: none; }
    .watchlist .project-row .mascot-bg { width: 20px; height: 20px; flex-basis: 20px; background: transparent; }
    .watchlist .project-row .mascot { width: 14px; height: 14px; flex-basis: 14px; }
    .watchlist .row-title { font-weight: 400; color: #ffffffcc; line-height: 16px; }
    .watchlist .active .row-title { font-weight: 500; color: #e5e5e5; }
    .watchlist .project-detail { display: block; padding-top: 0; line-height: 12px; color: #ffffff73; }
    .native-project-item > .native-icon-button { width: 24px; height: 24px; margin-right: 4px; opacity: 0; }
    .native-project-item:hover > .native-icon-button, .native-project-item:focus-within > .native-icon-button { opacity: 1; }
    .watchlist .counts { gap: 5px; padding: 0; }
    .watchlist .selected-project { border: 0; margin: 0; padding: 0; min-height: 0; }

    .watchlist .section-heading { height: 28px; flex-shrink: 0; padding: 0 8px; font-size: 12px; color: #ffffff80; }

    .project-row { display: flex; align-items: flex-start; gap: 9px; width: 100%; border-radius: 7px; padding: 9px 9px; text-align: left; margin-bottom: 2px; position: relative; }

    .notification-row p { margin: 0; font-size: 11px; line-height: 1.625; color: #ffffff80; }
    .mark-one { margin: 8px 4px 0 0; padding: 4px; border-radius: 4px; color: #ffffff4d; }
    .notification-foot { flex-shrink: 0; margin: 8px 0 0; border-top: 1px solid #ffffff0d; padding: 8px 4px 0; color: #ffffff4d; font-size: 10px; }

    .menu-row .mascot { width: 14px; height: 14px; flex-basis: 14px; }

    .usage-detail small { font-size: 10px; color: #8798aa; }

    @media (max-width: 640px) { body { padding: 14px 10px 88px; } .study-head { display: block; } .study-controls { max-width: none; justify-content: flex-start; margin-top: 12px; gap: 8px; } h1 { font-size: 19px; } .app { min-width: 580px; } #stage { overflow-x: auto; } .study-foot { display: block; } .study-foot span { display: block; margin: 5px 0; } }

        content = `<button class="menu-row" data-action="worktrees">⑂ <span>Switch worktree</span><span class="menu-detail">${escape(worktrees.get(project.id))} ›</span></button><button class="menu-row" data-action="switch-project">▱ <span>Switch project</span><span class="menu-detail">›</span></button><div class="menu-separator"></div><button class="menu-row" data-action="project-settings">⚙ <span>Project settings</span></button><div class="menu-separator"></div><button class="menu-row" data-action="settings">⚙ <span>Settings</span><span class="menu-detail">⌘,</span></button>`;
      } else if (popover.kind === "worktrees") {
        title = "Switch worktree";
        content = ["mine", "main", "feature/sidebar-watchlist", "fix/background-polling"].map(branch => `<button class="menu-row" data-action="choose-worktree" data-branch="${branch}"><span>${worktrees.get(project.id) === branch ? "✓" : "⑂"}</span><span>${branch}</span></button>`).join("") + `<p class="popover-note">Demo branches only. Switching changes this preview’s branch label.</p>`;
      } else if (popover.kind === "switch-project") {
        title = "Switch project";
        const found = projects.filter(p => p.name.toLowerCase().includes(menuQuery.toLowerCase()));
        content = `<label class="search"><span aria-hidden="true">⌕</span><input id="menu-project-search" aria-label="Find a project in the menu" value="${escape(menuQuery)}" placeholder="Find a project…"></label><div class="popover-scroll">${found.map(p => `<button class="menu-row" data-action="choose-project" data-project="${p.id}">${mascot(p)}<span>${escape(p.name)}</span><span class="menu-detail">${p.id === selectedProject ? "✓" : ""}</span></button>`).join("") || `<p class="popover-note">No matching projects.</p>`}</div>`;
      } else if (popover.kind === "project-settings") {
        title = "Project settings";
        content = `<label class="setting-field">Display name<input id="demo-project-name" value="${escape(project.name)}" maxlength="40"></label><label class="setting-field">Project color<select id="demo-project-color">${[[project.color, "Current color"], ["#69adf4", "Blue"], ["#b793d2", "Violet"], ["#65aaa2", "Teal"], ["#d084ac", "Rose"]].map(([color, label]) => `<option value="${color}" >${label}</option>`).join("")}</select></label><button class="save-demo" data-action="save-project-settings">Apply to this demo</button><p class="popover-note">Preview only. Your project files and MonoCode settings stay unchanged.</p>`;
      } else if (popover.kind === "settings") {
        title = "Settings";
        content = `<label class="setting-field">Sidebar density<select id="demo-density"><option value="comfortable" ${compact ? "" : "selected"}>Comfortable</option><option value="dense" ${compact ? "selected" : ""}>Compact</option></select></label><label class="setting-field">Notification sound<select id="demo-sound"><option ${demoSound === "Silent" ? "selected" : ""}>Silent</option><option ${demoSound === "Sound on" ? "selected" : ""}>Sound on</option></select></label><button class="save-demo" data-action="save-settings">Apply to this demo</button><p class="popover-note">Preview only. These controls affect this page until reload; no sound plays.</p>`;
      } else if (popover.kind === "usage") {
        const sample = usageSamples[popover.provider];
        title = `${sample.label} usage`;
        content = `<p class="popover-note">Illustrative values · not connected to your account.</p>${[["5-hour window", sample.short, sample.shortReset], ["Weekly window", sample.week, sample.weekReset]].map(([label, remaining, reset]) => `<div class="usage-detail"><div class="usage-detail-head"><span>${label}</span><strong>${remaining}% remaining</strong></div><span class="usage-meter"><i style="width:${remaining}%"></i></span><small>Resets in ${reset}</small></div>`).join("")}`;
      } else if (popover.kind === "session-filter") {
        title = "Filter sessions";
        content = ["all", "working", "waiting", "ready", "idle"].map(state => `<button class="menu-row" data-action="filter" data-filter="${state}"><span>${filter === state ? "✓" : ""}</span><span>${state === "all" ? "All sessions" : states[state].label}</span></button>`).join("");
      } else if (popover.kind === "notifications") {
        const rows = notificationRows();
        const unread = rows.filter(session => !readNotifications.has(session.id)).length;
        const shown = rows.filter(session => notificationFilter === "all" || (notificationFilter === "finished" ? session.state === "ready" : session.state === "waiting"));
        return `<section class="demo-popover notifications-popover" role="dialog" aria-label="Notifications" style="left:${popover.x}px;top:${popover.y}px"><header class="popover-head"><span>Notifications</span><span class="notification-unread">${unread} unread</span>${unread ? '<button class="mark-all" data-action="read-all">✓✓ Mark all read</button>' : ""}</header><div class="notification-filters" role="group" aria-label="Filter notifications">${[["all", "All"], ["decisions", "Decisions"], ["finished", "Finished"]].map(([value, label]) => `<button data-action="notification-filter" data-filter="${value}" aria-pressed="${notificationFilter === value}" class="${notificationFilter === value ? "selected" : ""}">${label}</button>`).join("")}</div><div class="notification-list">${shown.map((session, index) => `<div class="notification-item"><button class="notification-row" data-action="open-notification" data-session="${session.id}" title="Open ${escape(session.title)}"><span class="notification-meta">${readNotifications.has(session.id) ? "" : '<span class="dot working" aria-label="Unread"></span>'}<span class="${session.state === "ready" ? "ready" : "waiting"}">${session.state === "ready" ? "Finished" : index % 2 ? "Approval" : "Question"}</span><span>${escape(projects[session.project].name)}</span><span class="time">${["14:42", "14:39", "14:35", "14:28"][index % 4]}</span></span><strong>${escape(session.title)}</strong><p>${escape(session.detail)}</p></button>${readNotifications.has(session.id) ? "" : `<button class="mark-one" data-action="read-notification" data-session="${session.id}" aria-label="Mark ${escape(session.title)} read" title="Mark read">✓</button>`}</div>`).join("") || '<p class="popover-note">No notifications in this view.</p>'}</div><p class="notification-foot">Recent activity · decisions remain in their session</p></section>`;
      }
      return `<section class="demo-popover" role="dialog" aria-label="${escape(title)}" style="left:${popover.x}px;top:${popover.y}px"><div class="popover-head">${popover.kind === "usage" ? provider({ provider: popover.provider }) : ""}<span>${escape(title)}</span><button class="close-popover" data-action="close-popover" aria-label="Close menu">×</button></div>${content}</section>`;
    }

    function positionPopover()
    {
      const element = stage.querySelector(".demo-popover");
      if (!element || !popover) { return; }
      const rect = element.getBoundingClientRect();
      element.style.left = Math.max(10, Math.min(popover.x, window.innerWidth - rect.width - 10)) + "px";
      element.style.top = Math.max(10, Math.min(popover.y, window.innerHeight - rect.height - 64)) + "px";
    }

    function matching(items)
    {
      return items.filter(s => (filter === "all" || s.state === filter) && (!query || `${projects[s.project].name} ${s.title} ${s.detail}`.toLowerCase().includes(query.toLowerCase())));
    }

    function counts(project)
    {
      return `<span class="counts">${(current === 0 ? ["working", "waiting", "ready"] : ["waiting", "working", "ready"]).map(state => {
        const n = count(project.sessions, state);
        const symbol = current === 0 && state !== "working" ? `<span aria-hidden="true">${state === "waiting" ? "ⓘ" : "✓"}</span>` : '<span class="dot"></span>';
        return n ? `<span class="count ${state}" title="${n} ${states[state].label.toLowerCase()}">${symbol}${n}</span>` : "";
      }).join("")}</span>`;
    }

    function projectRow(project, tree = false)
    {
      const live = [...project.sessions].filter(s => s.state === "working").sort((a, b) => (b.runStarted || 0) - (a.runStarted || 0))[0] || project.sessions.find(s => s.state === "waiting") || project.sessions.find(s => s.state === "ready") || project.sessions[0];
      return `<button class="project-row ${project.id === selectedProject ? "active" : ""}" data-action="${tree ? "expand" : "project"}" data-project="${project.id}" ${tree ? `aria-expanded="${expanded.has(project.id)}"` : `aria-pressed="${project.id === selectedProject}"`} aria-label="${escape(project.name)}, ${count(project.sessions, "working")} working, ${count(project.sessions, "waiting")} need you, ${count(project.sessions, "ready")} ready">
        ${tree ? `<span class="chevron">${expanded.has(project.id) ? "⌄" : "›"}</span>` : ""}${mascot(project, true)}
        <span class="project-copy"><span class="row-title"><span class="name">${escape(project.name)}</span></span><span class="project-detail">${escape(live.detail)}</span></span>${counts(project)}
      </button>`;
    }

    function nativeProjectRow(project)
    {
      return `<div class="native-project-item ${project.id === selectedProject ? "active" : ""}">${projectRow(project)}<button class="native-icon-button" data-action="row-settings" data-project="${project.id}" aria-label="Project settings for ${escape(project.name)}" aria-haspopup="dialog">${icon("more")}</button></div>`;
    }

    function sessionRow(session, showProject = false)
    {
      const state = states[session.state];
      return `<button class="session-row ${session.id === selectedSession ? "active" : ""}" data-action="session" data-session="${session.id}" aria-pressed="${session.id === selectedSession}" title="${escape(session.title)} — ${state.label}">
        ${provider(session)}<span class="session-main"><span class="session-title">${escape(session.title)}</span><span class="session-meta"><span class="state-symbol ${session.state}">${state.symbol}</span>${showProject ? `<span class="project-name">${escape(projects[session.project].name)}</span><span>·</span>` : ""}<span class="${session.state}">${state.label}</span>${session.state === "working" ? `<span class="tiny-progress" title="${session.done} of 4 checklist steps complete">${[0, 1, 2, 3].map(i => `<i class="${i < session.done ? "done" : ""}"></i>`).join("")}</span>` : ""}</span></span><span class="session-time">${session.elapsed}</span>
      </button>`;
    }

    function search(placeholder = "Find projects or sessions…")
    {
      return `<label class="search"><span aria-hidden="true">⌕</span><input id="project-search" type="search" value="${escape(query)}" placeholder="${placeholder}" aria-label="Find projects or sessions"><kbd>⌘K</kbd></label>`;
    }

    function summary()
    {
      return `<div class="summary" aria-label="Filter by status">${["waiting", "working", "ready"].map(state => `<button data-action="filter" data-filter="${state}" class="${filter === state ? "selected" : ""}" aria-pressed="${filter === state}"><strong class="${state}">${count(sessions, state)}</strong> ${states[state].label}</button>`).join("")}</div>`;
    }

    function heading(label, detail = "")
    {
      return `<div class="section-heading"><span>${label}</span>${filter !== "all" ? `<button class="clear" data-action="clear-filter">Show all</button>` : `<span>${detail}</span>`}</div>`;
    }

    function noResults()
    {
      return `<div class="empty">No matching sessions.<br>Try another search or status.</div>`;
    }

    function sidebar(i)
    {
      const project = projects[selectedProject];
      const shownProjects = (i === 0 ? orderedProjects() : projects).filter(p => matching(p.sessions).length);
      const selected = matching(project.sessions);
      const top = `<div class="side-title">${mascot(project, true)}<span>${i === 2 ? "Activity" : "Projects"}</span>${i === 0 ? '<span class="subtle">16</span>' : projectMenuTrigger(project)}</div>${search()}${summary()}`;
      const foot = `<div class="side-footer"><button data-action="settings" aria-haspopup="dialog">⚙ Settings <span class="subtle">⌘,</span></button><span>16 projects</span><button data-action="reset">Reset demo</button></div>`;
      if (i === 0) {
        return `<div class="native-workspace-head">${mascot(project)}${projectMenuTrigger(project, true)}<button class="native-icon-button" data-action="focus-search" aria-label="Search project">${icon("search")}</button></div>${search("Search")}<section class="native-projects" aria-label="Projects"><div class="native-projects-head"><span>Projects</span><button class="native-icon-button" data-action="open-project" aria-label="Open project" aria-haspopup="dialog">${icon("plus")}</button></div><div class="project-list scroll" data-scroll="projects">${shownProjects.map(p => nativeProjectRow(p)).join("") || noResults()}</div></section><section class="selected-project"><div class="section-heading"><span>Today</span><button class="native-icon-button" data-action="session-filter" aria-label="Filter sessions" aria-haspopup="dialog">${icon("filter")}</button></div><div class="session-list scroll" data-scroll="sessions">${selected.map(s => sessionRow(s)).join("") || noResults()}</div></section>`;
      }
      if (i === 1) {
        return `${top}${heading("Projects and sessions", "Click to expand")}<div class="project-list scroll" data-scroll="projects">${shownProjects.map(p => `<section class="tree-project">${projectRow(p, true)}${expanded.has(p.id) ? `<div class="tree-sessions">${matching(p.sessions).map(s => sessionRow(s)).join("")}</div>` : ""}</section>`).join("") || noResults()}</div>${foot}`;
      }
      if (i === 2) {
        const filtered = matching(sessions).filter(s => activityProject === null || s.project === activityProject);
        return `${top}<div class="project-chip-list" aria-label="Filter activity by project"><button class="project-chip ${activityProject === null ? "active" : ""}" data-action="activity-project" data-project="all" aria-pressed="${activityProject === null}">All projects</button>${projects.map(p => `<button class="project-chip ${activityProject === p.id ? "active" : ""}" data-action="activity-project" data-project="${p.id}" aria-pressed="${activityProject === p.id}">${mascot(p)}${escape(p.name)}</button>`).join("")}</div><div class="activity-list scroll" data-scroll="activity">${["waiting", "working", "ready", "idle"].map(state => {
          const group = filtered.filter(s => s.state === state);
          return group.length ? `<section class="activity-group"><div class="section-heading"><span class="${state}">${states[state].label}</span><span>${group.length}</span></div>${group.map(s => sessionRow(s, true)).join("")}</section>` : "";
        }).join("") || noResults()}</div>${foot}`;
      }
      const visible = projects.slice(carousel, carousel + 5);
      return `<div class="side-title">${mascot(project, true)}${projectMenuTrigger(project)}</div><div class="handoff"><strong><span class="working">↪</span> Handoff <span class="subtle">18m ago</span></strong>Next session: review the current changes and continue the remaining checks.<br><button data-action="handoff">Continue</button></div>${search("Search sessions…")}${heading("Today", `${project.sessions.length} sessions`)}<div class="session-list scroll" data-scroll="sessions">${selected.map(s => sessionRow(s)).join("") || noResults()}</div><div class="working-preview">${heading(`<span class="working">●</span> Working`, `${count(sessions, "working")}`)}${sessions.filter(s => s.state === "working").slice(0, 2).map(s => sessionRow(s, true)).join("")}</div><div class="spaces" aria-label="Projects"><button class="space-arrow" data-action="page" data-direction="-1" aria-label="Previous projects" ${carousel === 0 ? "disabled" : ""}>‹</button>${visible.map(p => `<button class="space ${p.id === selectedProject ? "active" : ""}" data-action="project" data-project="${p.id}" title="${escape(p.name)}" aria-label="${escape(p.name)}">${mascot(p)}${count(p.sessions, "working") ? '<span class="dot"></span>' : ""}</button>`).join("")}<button class="space-arrow" data-action="page" data-direction="1" aria-label="More projects" ${carousel === 11 ? "disabled" : ""}>›</button></div>`;
    }

    function conversation()
    {
      const session = sessions.find(s => s.id === selectedSession);
      const project = projects[session.project];
      const state = states[session.state];
      const model = session.provider === "codex" ? "GPT-6-Astra" : "Claude Opus";
      const stepNames = ["Read the current implementation", "Make the focused change", "Run the relevant checks", "Review and write the handoff"];
      const statusText = session.state === "waiting" ? "I’ve reached a decision that needs your input." : session.state === "ready" ? "The changes are ready for your review." : session.state === "idle" ? "This session is saved for later." : "I’m working through the next checklist step.";
      return `<header class="conversation-top">${mascot(project)}<span>${escape(project.name)}</span><span>/</span><span>${escape(session.title)}</span><span class="session-state ${session.state}"><span class="dot"></span>${state.label}</span></header>
        <div class="conversation-content" data-scroll="conversation">
          <div class="user-message">${escape(session.title)}. Follow the existing project patterns, check the result, and leave a short handoff when you’re done.</div><div class="message-time">Today, 14:32 · sample conversation</div>
          <div class="response-label">${provider(session)}<span>${model}</span><span>·</span><span>High effort</span></div>
          <article class="response"><h2>${statusText}</h2><p>${escape(session.detail)}. This sample shows how the sidebar keeps this session’s state visible while you work elsewhere.</p>
          <ul class="steps" aria-label="Sample task checklist">${stepNames.map((step, i) => `<li class="${i < session.done ? "complete" : i === session.done && session.state === "working" ? "current" : ""}"><span class="step-index">${i < session.done ? "✓" : i + 1}</span><span>${step}</span><span class="step-state">${i < session.done ? "Complete" : i === session.done && session.state === "working" ? "In progress" : "Pending"}</span></li>`).join("")}</ul>
          <div class="peer-note">${provider({ provider: "claude" })}<div><strong>review-session → ${escape(project.name)}</strong> <small>· 3m ago</small><br>I’ve finished my review of the shared component. The notes are in the handoff; the next session can continue from there.</div></div>
          <div class="effort-note">Sample communication card · ${session.done} of 4 checklist steps complete</div></article>
        </div>
        <div class="composer-area"><div class="composer"><textarea id="composer" aria-label="Sample message" placeholder="Ask, build, / for commands, @ for references…">${escape(drafts.get(session.id) || "")}</textarea><div class="composer-controls"><span class="model-chip">${provider(session)}${model} <span class="effort">High</span>⌄</span><span class="model-chip">♢ Full access</span><button class="send" data-action="send" aria-label="Preview sending a sample message">↑</button></div></div><div class="composer-meta"><span>▱ Current checkout &nbsp; ⑂ ${escape(worktrees.get(session.project))}</span><span>64K · 25% ◯</span></div><div class="sample-feedback" role="status">${escape(feedback.get(session.id) || "")}</div></div>`;
    }

    function render(i)
    {
      const selected = sessions.find(s => s.id === selectedSession);
      const direction = directions[i];
      document.getElementById("study-title").textContent = direction.name;
      document.getElementById("study-copy").innerHTML = direction.copy;
      document.getElementById("tradeoff").innerHTML = direction.tradeoff;
      return `<main class="app ${direction.className} ${compact ? "dense" : ""} ${laptop ? "laptop" : ""}" aria-label="MonoCode ${direction.name} prototype"><div class="titlebar"><div class="traffic" aria-hidden="true"><i></i><i></i><i></i></div><span class="toolbar-glyph" aria-hidden="true">◧</span>${notificationButton()}<span class="toolbar-glyph" aria-hidden="true">‹</span><span class="toolbar-glyph" aria-hidden="true">›</span><div class="tab">${provider(selected)}<span>${escape(selected.title)}</span><span class="close" aria-hidden="true">×</span></div><span class="toolbar-glyph" aria-hidden="true">+</span><span class="title-caption">Personal workspace — MonoCode</span></div><div class="body"><aside class="sidebar" aria-label="Projects and sessions">${sidebar(i)}</aside><section class="conversation" aria-label="Selected session">${conversation()}</section></div><footer class="app-footer">${usageChip("claude")}${usageChip("codex")}<span class="footer-right"><span>♧ ${demoSound}</span><span>▣ Workspaces · 3</span><span>▥ Stacks · 1 up</span></span></footer></main>${popoverContent()}`;
    }

    const variants = [() => render(0), () => render(1), () => render(2), () => render(3)];
    const stage = document.getElementById("stage");
    const picker = document.querySelector(".proto-picker");
    const highlight = picker.querySelector(".proto-picker-highlight");
    const items = [...picker.querySelectorAll(".proto-picker-item:not(.proto-picker-replay)")];
    const replay = picker.querySelector(".proto-picker-replay");
    let current = 0;

    function moveHighlight()
    {
      const el = items[current];
      highlight.style.width = el.offsetWidth + "px";
      highlight.style.transform = `translateX(${el.offsetLeft}px)`;
    }

    function mount(i)
    {
      stage.innerHTML = "";
      requestAnimationFrame(() => { stage.innerHTML = variants[i](); positionPopover(); });
    }

    function setActive(i)
    {
      if (i < 0 || i >= variants.length) { return; }
      popover = null;
      current = i;
      items.forEach((el, j) => {
        el.toggleAttribute("data-active", j === i);
        if (j === i) { el.setAttribute("aria-current", "true"); } else { el.removeAttribute("aria-current"); }
      });
      moveHighlight();
      const url = new URL(location);
      url.searchParams.set("v", i + 1);
      // Sandboxed previews have an opaque origin and cannot rewrite their URL.
      try { history.replaceState(null, "", url); } catch (_) { /* Keep the selected layout in memory. */ }
      mount(i);
    }

    function update(keepSearch = false)
    {
      const positions = new Map([...stage.querySelectorAll("[data-scroll]")].map(el => [el.dataset.scroll, el.scrollTop]));
      const searchPosition = stage.querySelector("#project-search")?.selectionStart;
      const focusedProject = document.activeElement?.closest(".watchlist .project-list .project-row")?.dataset.project;
      stage.innerHTML = variants[current]();
      positionPopover();
      stage.querySelectorAll("[data-scroll]").forEach(el => { el.scrollTop = positions.get(el.dataset.scroll) || 0; });
      if (focusedProject !== undefined && !popover) { stage.querySelector(`.project-row[data-project="${focusedProject}"]`)?.focus({ preventScroll: true }); }
      if (keepSearch) {
        const input = stage.querySelector("#project-search");
        input.focus();
        if (typeof searchPosition === "number") { input.setSelectionRange(searchPosition, searchPosition); }
      }
    }

    items.forEach((el, i) => el.addEventListener("click", () => setActive(i)));
    replay?.addEventListener("click", () => mount(current));
    window.addEventListener("resize", () => { moveHighlight(); positionPopover(); });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape" && popover) { popover = null; update(); stage.querySelector('[data-action="project-menu"]')?.focus(); return; }
      if ((e.metaKey || e.ctrlKey) && e.key === ",") {
        e.preventDefault();
        const rect = stage.querySelector(".sidebar").getBoundingClientRect();
        popover = { kind: "settings", project: selectedProject, x: rect.left + 8, y: rect.top + 40 }; update(); return;
      }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "k") { e.preventDefault(); stage.querySelector("#project-search")?.focus(); return; }
      if (popover) { return; }
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) { return; }
      if (e.metaKey || e.ctrlKey || e.altKey) { return; }
      const num = parseInt(e.key, 10);
      if (num >= 1 && num <= variants.length) { setActive(num - 1); }
      else if (e.key === "ArrowRight") { setActive((current + 1) % variants.length); }
      else if (e.key === "ArrowLeft") { setActive((current - 1 + variants.length) % variants.length); }
      else if (e.key === "r" || e.key === "R") { mount(current); }
    });
    stage.addEventListener("input", e => {
      if (e.target.id === "project-search") { query = e.target.value; update(true); }
      if (e.target.id === "menu-project-search") {
        menuQuery = e.target.value;
        const caret = e.target.selectionStart;
        update();
        const input = stage.querySelector("#menu-project-search");
        input.focus(); input.setSelectionRange(caret, caret);
      }
      if (e.target.id === "composer") { drafts.set(selectedSession, e.target.value); }
    });
    stage.addEventListener("click", e => {
      const button = e.target.closest("button[data-action]");
      if (!button) { return; }
      const action = button.dataset.action;
      if (action === "focus-search") { stage.querySelector("#project-search")?.focus(); return; }
      if (["project-menu", "settings", "usage", "notifications", "open-project", "row-settings", "session-filter"].includes(action)) {
        const rect = button.getBoundingClientRect();
        const kind = action === "open-project" ? "switch-project" : action === "row-settings" ? "project-settings" : action;
        popover = { kind, project: Number(button.dataset.project ?? selectedProject), provider: button.dataset.provider, x: rect.left, y: rect.bottom + 6 };
        menuQuery = "";
      } else if (action === "notification-filter") {
        notificationFilter = button.dataset.filter;
      } else if (action === "read-all") {
        notificationRows().forEach(session => readNotifications.add(session.id));
      } else if (action === "read-notification") {
        readNotifications.add(button.dataset.session);
      } else if (action === "open-notification") {
        selectedSession = button.dataset.session;
        selectedProject = sessions.find(session => session.id === selectedSession).project;
        readNotifications.add(selectedSession);
        popover = null;
      } else if (["worktrees", "switch-project", "project-settings"].includes(action)) {
        popover.kind = action;
      } else if (action === "choose-worktree") {
        worktrees.set(popover.project, button.dataset.branch); popover = null;
      } else if (action === "close-popover") {
        popover = null;
      } else if (action === "save-project-settings") {
        const input = stage.querySelector("#demo-project-name");
        const name = input.value.trim();
        if (!name) { input.focus(); return; }
        projects[popover.project].name = name;
        projects[popover.project].color = stage.querySelector("#demo-project-color").value;
        popover = null;
      } else if (action === "save-settings") {
        compact = stage.querySelector("#demo-density").value === "dense";
        demoSound = stage.querySelector("#demo-sound").value;
        document.getElementById("density").value = compact ? "dense" : "comfortable";
        popover = null;
      } else if (action === "project" || action === "expand" || action === "choose-project") {
        selectedProject = Number(button.dataset.project);
        selectedSession = (matching(projects[selectedProject].sessions)[0] || projects[selectedProject].sessions[0]).id;
        if (action === "choose-project") { popover = null; query = ""; filter = "all"; carousel = Math.min(11, selectedProject); }
        if (action === "expand") {
          if (expanded.has(selectedProject)) { expanded.delete(selectedProject); } else { expanded.add(selectedProject); }
        }
      } else if (action === "session") {
        selectedSession = button.dataset.session;
        selectedProject = sessions.find(s => s.id === selectedSession).project;
      } else if (action === "filter") {
        filter = filter === button.dataset.filter ? "all" : button.dataset.filter;
        if (popover?.kind === "session-filter") { popover = null; }
      } else if (action === "clear-filter") {
        filter = "all";
      } else if (action === "activity-project") {
        activityProject = button.dataset.project === "all" ? null : Number(button.dataset.project);
      } else if (action === "page") {
        carousel = Math.min(11, Math.max(0, carousel + Number(button.dataset.direction)));
      } else if (action === "handoff") {
        drafts.set(selectedSession, "Read .claude/handoff.md and continue from where it left off.");
        feedback.set(selectedSession, "Sample handoff loaded into the composer. Nothing has been sent.");
      } else if (action === "send") {
        const draft = drafts.get(selectedSession)?.trim();
        feedback.set(selectedSession, draft ? "Message previewed locally. This design does not send messages to an agent." : "Write a sample message first.");
      } else if (action === "reset") {
        selectedProject = 0; selectedSession = "0-0"; query = ""; filter = "all"; activityProject = null; expanded = new Set([0, 1, 2]); carousel = 0; drafts.clear(); feedback.clear();
        popover = null; menuQuery = ""; demoSound = "Silent";
        notificationFilter = "all"; readNotifications.clear();
        projects.forEach((project, index) => {
          project.name = originalProjects[index].name; project.color = originalProjects[index].color;
          project.sessions.forEach((session, sessionIndex) => { Object.assign(session, originalProjects[index].sessions[sessionIndex]); });
          worktrees.set(project.id, project.id === 0 ? "mine" : "main");
        });
      }
      update();
      if (["project-menu", "settings", "usage", "worktrees", "switch-project", "project-settings", "open-project", "row-settings", "session-filter"].includes(action)) {
        (stage.querySelector('.demo-popover input, .demo-popover .menu-row, .demo-popover select') || stage.querySelector('.demo-popover .close-popover'))?.focus();
      }
    });
    document.addEventListener("click", e => {
      if (popover && !e.target.closest('.demo-popover, [data-action="project-menu"], [data-action="settings"], [data-action="usage"], [data-action="notifications"], [data-action="open-project"], [data-action="row-settings"], [data-action="session-filter"]')) {
        popover = null; update();
      }
    });
    stage.addEventListener("pointerover", e => {
      const list = e.target.closest(".watchlist .project-list");
      if (list && !list.contains(e.relatedTarget)) { pointerInProjects = true; }
    });
    stage.addEventListener("pointerout", e => {
      const list = e.target.closest(".watchlist .project-list");
      if (list && !list.contains(e.relatedTarget)) {
        pointerInProjects = false;
        const before = projectOrder.join(",");
        orderedProjects();
        if (projectOrder.join(",") !== before) { update(); }
      }
    });
    stage.addEventListener("focusout", e => {
      if (e.target.closest(".watchlist .project-list") && !e.relatedTarget?.closest(".watchlist .project-list")) {
        queueMicrotask(() => {
          const before = projectOrder.join(","); orderedProjects();
          if (projectOrder.join(",") !== before) { update(); }
        });
      }
    });
    document.getElementById("simulate-run").addEventListener("click", () => {
      const project = [...projects].reverse().find(p => !p.sessions.some(s => s.state === "working")) || projects[15];
      Object.assign(project.sessions[0], { state: "working", runStarted: Date.now(), elapsed: "now", done: 0, detail: "New run · reading the existing flow" });
      update();
    });
    document.getElementById("density").addEventListener("change", e => { compact = e.target.value === "dense"; update(); });
    document.getElementById("size").addEventListener("change", e => { laptop = e.target.value === "laptop"; update(); });
    const initial = (parseInt(new URLSearchParams(location.search).get("v"), 10) || 1) - 1;
    document.addEventListener("visibilitychange", () => document.documentElement.classList.toggle("page-hidden", document.hidden));
    setActive(initial >= 0 && initial < variants.length ? initial : 0);
    requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute("data-ready", "")));
  </script>
</body>
</html>
