<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonoCode · Project home (v2)</title>
<style>
  /* Tokens copied from src/styles/index.css (dark theme). c(a) = content at alpha a. */
  :root {
    --bg: hsl(240 0% 9%);
    --side: color-mix(in srgb, hsl(240 0% 9%) 90%, black);
    --c: 235 235 235;
    --stroke: rgb(var(--c) / .07);
    --sel-subtle: rgb(var(--c) / .08);
    --sel: rgb(var(--c) / .10);
    --sel-hover: rgb(var(--c) / .15);
    --sel-emph: rgb(var(--c) / .20);
    --accent: hsl(211 92% 62%);
    --emerald-400: #34d399;
    --emerald-300: #6ee7b7;
    --amber-400: #fbbf24;
    --violet-400: #a78bfa;
    --red-400: #f87171;
    --ease: cubic-bezier(.22, 1, .36, 1);
    --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: rgb(var(--c)); }
  body { font-size: 14px; line-height: 1.4; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  button:focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 70%, transparent); outline-offset: 1px; border-radius: 6px; }
  svg { flex: none; }
  .i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .i-sm { width: 12px; height: 12px; }
  .i-14 { width: 14px; height: 14px; }

  .app { display: grid; grid-template-columns: 260px minmax(0, 1fr); height: 100vh; }

  /* ---------- sidebar (Sidebar.tsx / ProjectRail.tsx) ---------- */
  .side { background: var(--side); border-right: 1px solid var(--stroke); display: flex; flex-direction: column; min-height: 0; }
  .side-top { height: 40px; display: flex; align-items: center; padding-left: 14px; gap: 8px; flex: none; }
  .tl { width: 12px; height: 12px; border-radius: 50%; background: rgb(var(--c) / .16); }
  .side-scroll { overflow: auto; padding-bottom: 12px; display: flex; flex-direction: column; gap: 10px; }
  .group { display: flex; flex-direction: column; gap: 1px; padding: 0 8px; }
  .rail { height: 32px; display: flex; align-items: center; gap: 8px; border-radius: 6px; padding: 0 8px; font-size: 14px; font-weight: 500; color: rgb(var(--c) / .5); transition: background-color 120ms ease, color 120ms ease; width: 100%; }
  .rail .i { opacity: .7; }
  .rail:hover { background: rgb(var(--c) / .1); color: rgb(var(--c)); }
  .rail.on { background: var(--sel); color: rgb(var(--c)); }
  .rail .cnt { margin-left: auto; font-size: 11px; color: rgb(var(--c) / .4); font-weight: 400; }
  .rail kbd { margin-left: auto; font: 11px var(--mono); color: rgb(var(--c) / .35); }
  .sec { display: flex; align-items: center; gap: 4px; padding: 4px 12px 6px; font-size: 12px; line-height: 20px; color: rgb(var(--c) / .5); }
  .sec .sp { flex: 1; }
  .sec button { width: 20px; height: 20px; display: grid; place-items: center; border-radius: 6px; color: rgb(var(--c) / .5); }
  .sec button:hover { background: rgb(var(--c) / .08); }
  .proj { height: 32px; display: flex; align-items: center; gap: 8px; border-radius: 6px; padding: 0 8px; width: 100%; transition: background-color 120ms ease; position: relative; }
  .proj:hover { background: rgb(var(--c) / .05); }
  .proj.on { background: var(--sel); }
  .logo { width: 16px; height: 16px; border-radius: 3px; display: grid; place-items: center; font-size: 9px; font-weight: 800; color: #111; flex: none; }
  .proj .nm { flex: 1; min-width: 0; font-size: 14px; font-weight: 500; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .proj .meta { font-size: 11px; color: rgb(var(--c) / .45); }
  /* ProjectAgentStatus badge: amber pill with ping halo */
  .needs { position: relative; display: inline-grid; place-items: center; height: 14px; min-width: 14px; padding: 0 4px; border-radius: 999px; background: var(--amber-400); color: #000; font-size: 9px; font-weight: 700; }
  .needs { animation: halo 1.6s cubic-bezier(0, 0, .2, 1) infinite; }
  @keyframes halo { 0% { box-shadow: 0 0 0 0 rgb(251 191 36 / .5); } 75%, 100% { box-shadow: 0 0 0 6px rgb(251 191 36 / 0); } }
  .sess-list { display: flex; flex-direction: column; gap: 1px; padding: 2px 0 6px 6px; }
  .sess { display: flex; align-items: center; gap: 6px; padding: 5px 8px 5px 6px; border-radius: 6px; border: 1px solid transparent; color: rgb(var(--c) / .8); width: 100%; transition: background-color 120ms ease; }
  .sess:hover { background: rgb(var(--c) / .05); }
  .sess.on { background: var(--sel); color: rgb(var(--c)); }
  .sess .t { flex: 1; min-width: 0; font-size: 13px; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .sess .tm { font-size: 11px; color: rgb(var(--c) / .4); font-variant-numeric: tabular-nums; }

  /* session state slot (16px) */
  .st { width: 16px; height: 16px; display: grid; place-items: center; flex: none; position: relative; }
  .st.working::after { content: ""; width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid rgb(var(--c) / .12); border-top-color: var(--accent); animation: spin 800ms linear infinite; }
  .st.waiting::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--amber-400); box-shadow: 0 0 0 3px rgb(251 191 36 / .2); }
  .st.done::after { content: ""; width: 7px; height: 4px; border: solid var(--emerald-400); border-width: 0 0 1.75px 1.75px; transform: translateY(-1px) rotate(-45deg); }
  .st.idle::after { content: ""; width: 5px; height: 5px; border-radius: 50%; background: rgb(var(--c) / .25); }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ---------- main + tab bar (TitleBar.tsx) ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .tabs { height: 40px; display: flex; align-items: center; gap: 2px; padding: 0 10px; flex: none; }
  .tab { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 8px; border-radius: 6px; font-size: 13px; line-height: 1.2; color: rgb(var(--c) / .5); max-width: 240px; transition: background-color 120ms ease, color 120ms ease; }
  .tab:hover { background: rgb(var(--c) / .05); color: rgb(var(--c)); }
  .tab.on { background: var(--sel); color: rgb(var(--c)); }
  .tab .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .pi { opacity: .55; }
  .tab.on .pi { opacity: 1; }
  .tab-add { width: 26px; height: 26px; border-radius: 6px; background: rgb(var(--c) / .1); color: rgb(var(--c) / .7); display: grid; place-items: center; margin-left: 4px; }
  .tab-add:hover { background: rgb(var(--c) / .15); }
  .claude { color: #d97757; font-size: 14px; line-height: 1; width: 14px; text-align: center; }

  .view { flex: 1; overflow: auto; min-height: 0; }
  .view[hidden] { display: none; }

  /* ---------- page (max-w-5xl like Inbox) ---------- */
  .page { max-width: 880px; margin: 0 auto; padding: 22px 28px 120px; display: flex; flex-direction: column; gap: 26px; }
  .ph-header { display: flex; align-items: center; gap: 12px; }
  .ph-header .logo { width: 28px; height: 28px; border-radius: 7px; font-size: 13px; }
  .ph-header h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: -.01em; line-height: 1.2; }
  .subline { font-size: 12px; color: rgb(var(--c) / .5); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin-top: 2px; }
  .subline .mono { font: 11px var(--mono); }
  .grow { flex: 1; }
  .btn2 { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; border: 1px solid rgb(var(--c) / .1); padding: 4px 10px; font-size: 12px; color: rgb(var(--c) / .7); transition: background-color 120ms ease, color 120ms ease, transform 100ms var(--ease); white-space: nowrap; }
  .btn2:hover { background: rgb(var(--c) / .1); color: rgb(var(--c)); }
  .btn2:active { transform: scale(.97); }
  .btn1 { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 5px 10px; font-size: 12px; font-weight: 500; background: #fff; color: #000; transition: background-color 120ms ease, transform 100ms var(--ease); white-space: nowrap; }
  .btn1:hover { background: rgb(255 255 255 / .9); }
  .btn1:active { transform: scale(.97); }

  .h2 { display: flex; align-items: center; gap: 8px; font-size: 12px; color: rgb(var(--c) / .5); margin: 0 0 6px; padding: 0 8px; line-height: 20px; }
  .h2 .pill { font: 10px var(--mono); background: rgb(var(--c) / .07); color: rgb(var(--c) / .5); padding: 1px 7px; border-radius: 999px; }
  .h2 .amber { background: rgb(251 191 36 / .14); color: var(--amber-400); }

  /* handoff strip */
  .handoff { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border-radius: 8px; background: rgb(var(--c) / .04); font-size: 13px; }
  .handoff .k { font-size: 11px; color: rgb(var(--c) / .4); white-space: nowrap; padding-top: 1px; }
  .handoff .txt { flex: 1; color: rgb(var(--c) / .8); }
  .handoff .age { font-size: 11px; color: rgb(var(--c) / .4); white-space: nowrap; padding-top: 1px; }

  /* rows (MonoOverview style) */
  .rows { display: flex; flex-direction: column; gap: 1px; }
  .row { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 6px; width: 100%; transition: background-color 120ms ease; position: relative; }
  button.row:hover, .row.hov:hover { background: rgb(var(--c) / .05); }
  .tile { width: 28px; height: 28px; border-radius: 6px; background: rgb(var(--c) / .06); color: rgb(var(--c) / .6); display: grid; place-items: center; flex: none; }
  .row .ttl { font-size: 13px; line-height: 20px; color: rgb(var(--c) / .9); }
  .row .sub { font-size: 11px; line-height: 16px; color: rgb(var(--c) / .4); display: flex; gap: 6px; flex-wrap: wrap; }
  .row .body { flex: 1; min-width: 0; }
  .row .go { opacity: 0; color: rgb(var(--c) / .5); font-size: 11px; display: flex; align-items: center; gap: 4px; transition: opacity 120ms ease; white-space: nowrap; }
  .row:hover .go, .row:focus-visible .go { opacity: 1; }
  .age-chip { font-size: 11px; color: rgb(var(--c) / .45); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .age-chip.old { color: var(--amber-400); }
  .tag { font-size: 10px; padding: 0 6px; border-radius: 4px; line-height: 16px; background: rgb(var(--c) / .07); color: rgb(var(--c) / .55); white-space: nowrap; }
  .wait.leaving { animation: leave 260ms var(--ease) forwards; }
  @keyframes leave { to { opacity: 0; transform: translateX(8px); } }

  /* phases */
  .phase { border-radius: 8px; transition: background-color 160ms ease; }
  .phase.open { background: rgb(var(--c) / .03); }
  .phase-head { display: flex; align-items: center; gap: 10px; padding: 8px; border-radius: 8px; width: 100%; }
  .phase:not(.open) .phase-head:hover { background: rgb(var(--c) / .05); }
  .pnum { width: 24px; font: 11px var(--mono); color: rgb(var(--c) / .35); flex: none; }
  .pname { flex: 1; min-width: 0; font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .phase.s-done:not(.open) .pname, .phase.s-todo:not(.open) .pname { font-weight: 400; color: rgb(var(--c) / .55); }
  .pchats { display: inline-flex; gap: 0; }
  .pchats .st { width: 12px; }
  .pstatus { font-size: 11px; color: rgb(var(--c) / .45); white-space: nowrap; border-radius: 5px; padding: 2px 6px; transition: background-color 120ms ease; }
  .pstatus:hover { background: rgb(var(--c) / .08); color: rgb(var(--c)); }
  .s-done .pstatus { color: var(--emerald-300); }
  .s-built .pstatus { color: var(--violet-400); }
  .s-progress .pstatus { color: var(--accent); }
  .s-blocked .pstatus { color: var(--red-400); }
  .chev { color: rgb(var(--c) / .35); transition: transform 200ms var(--ease); }
  .phase.open .chev { transform: rotate(90deg); }
  .pbody { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 220ms var(--ease); }
  .phase.open .pbody { grid-template-rows: 1fr; }
  .pinner { min-height: 0; overflow: hidden; }
  .pcontent { padding: 0 12px 14px 52px; display: flex; flex-direction: column; gap: 12px; opacity: 0; transition: opacity 180ms ease; }
  .phase.open .pcontent { opacity: 1; }
  .what { margin: 0; font-size: 13px; color: rgb(var(--c) / .6); }
  .lbl { font-size: 11px; color: rgb(var(--c) / .4); margin-bottom: 5px; }
  .checks { display: flex; flex-direction: column; gap: 5px; }
  .chk { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: rgb(var(--c) / .8); }
  .chk .by { font-size: 11px; color: rgb(var(--c) / .35); }
  .circ { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgb(var(--c) / .25); display: grid; place-items: center; flex: none; transition: background-color 200ms ease, border-color 200ms ease; }
  .circ.on { background: rgb(52 211 153 / .2); border-color: transparent; color: var(--emerald-300); }
  .circ.on::after { content: ""; width: 6px; height: 3px; border: solid currentColor; border-width: 0 0 1.75px 1.75px; transform: translateY(-1px) rotate(-45deg); }
  .chk.on .ct { color: rgb(var(--c) / .4); }
  .quote { font-size: 12.5px; color: rgb(var(--c) / .75); padding-left: 10px; box-shadow: inset 2px 0 rgb(var(--c) / .12); }
  .quote small { display: block; font-size: 11px; color: rgb(var(--c) / .4); margin-top: 2px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 28px; display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; border: 1px solid rgb(var(--c) / .1); background: rgb(var(--c) / .05); padding: 0 8px 0 4px; font-size: 12px; color: rgb(var(--c) / .8); transition: background-color 120ms ease, transform 100ms var(--ease); }
  .chip:hover { background: rgb(var(--c) / .1); }
  .chip:active { transform: scale(.97); }
  .chip .tm { color: rgb(var(--c) / .4); font-size: 11px; }
  .suggest { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; background: rgb(52 211 153 / .08); font-size: 12.5px; color: var(--emerald-300); animation: rise 260ms var(--ease); }
  .suggest span { flex: 1; }
  .suggest .why { color: rgb(var(--c) / .45); font-size: 11px; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }
  .pactions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .start { opacity: 0; transition: opacity 120ms ease; }
  .phase-head:hover .start, .phase-head:focus-within .start { opacity: 1; }
  .phase.flash { animation: flash 1300ms var(--ease); }
  @keyframes flash { 0%, 35% { box-shadow: inset 0 0 0 1px rgb(var(--c) / .35); } 100% { box-shadow: inset 0 0 0 1px transparent; } }
  .phase.changed .glyph { animation: pop 380ms var(--ease); }
  @keyframes pop { 40% { transform: scale(1.25); } }

  /* phase glyphs */
  .glyph { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgb(var(--c) / .25); display: grid; place-items: center; flex: none; position: relative; transition: background-color 200ms ease, border-color 200ms ease; }
  .g-done { background: rgb(52 211 153 / .2); border-color: transparent; color: var(--emerald-300); }
  .g-done::after { content: ""; width: 6px; height: 3px; border: solid currentColor; border-width: 0 0 1.75px 1.75px; transform: translateY(-1px) rotate(-45deg); }
  .g-built { border-color: var(--violet-400); background: linear-gradient(90deg, var(--violet-400) 50%, transparent 50%); }
  .g-progress { border-color: var(--accent); }
  .g-progress::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); }
  .g-blocked { border-color: var(--red-400); }
  .g-blocked::after { content: ""; width: 7px; height: 1.75px; background: var(--red-400); border-radius: 1px; }

  .loose { font-size: 12px; color: rgb(var(--c) / .45); }

  /* ---------- all projects ---------- */
  .proj-row .ph { font-size: 12px; color: rgb(var(--c) / .55); }
  .proj-row .logo { width: 28px; height: 28px; border-radius: 6px; font-size: 12px; }
  .spend { font-size: 11px; color: rgb(var(--c) / .4); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .spend.hot { color: var(--amber-400); }

  /* ---------- chat view ---------- */
  .chat { display: flex; flex-direction: column; height: 100%; }
  .strip-wrap { padding: 6px 16px 0; flex: none; }
  .strip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12px; color: rgb(var(--c) / .55); transition: background-color 120ms ease, color 120ms ease; }
  .strip:hover, .strip[aria-expanded="true"] { background: rgb(var(--c) / .08); color: rgb(var(--c)); }
  .strip b { font-weight: 500; color: rgb(var(--c) / .85); }
  .strip .glyph { width: 12px; height: 12px; }
  .strip .glyph::after { transform: scale(.75); }
  .needs-pill { font-size: 10px; font-weight: 600; color: var(--amber-400); background: rgb(251 191 36 / .14); border-radius: 999px; padding: 1px 7px; }
  .transcript { flex: 1; overflow: auto; padding: 16px 0 24px; }
  .tx { max-width: 760px; margin: 0 auto; padding: 0 24px; display: flex; flex-direction: column; gap: 16px; font: 13px/20px var(--mono); }
  .tx .u { align-self: flex-end; background: var(--sel); padding: 8px 12px; border-radius: 10px; max-width: 80%; font-family: system-ui, -apple-system, sans-serif; font-size: 14px; }
  .tx .a { color: rgb(var(--c) / .9); }
  .tx .a p { margin: 0 0 6px; }
  .ask-card { border-radius: 10px; border: 1px solid rgb(var(--c) / .1); padding: 10px 12px; display: flex; gap: 10px; align-items: flex-start; font-family: system-ui, -apple-system, sans-serif; font-size: 13px; transition: box-shadow 200ms ease; }
  .ask-card .w { font-size: 11px; color: rgb(var(--c) / .45); margin-top: 2px; }
  .ask-card.hl { animation: hl 1600ms var(--ease); }
  @keyframes hl { 0%, 40% { box-shadow: 0 0 0 2px rgb(251 191 36 / .55); } 100% { box-shadow: 0 0 0 2px transparent; } }
  .ask-card .circ { cursor: pointer; margin-top: 1px; }
  .ask-card .circ:hover { border-color: rgb(var(--c) / .5); }
  .composer-wrap { padding: 0 6px 6px; flex: none; max-width: 812px; width: 100%; margin: 0 auto; }
  .composer { border-radius: 8px; border: 1px solid rgb(var(--c) / .1); transition: border-color 120ms ease; }
  .composer:focus-within { border-color: rgb(var(--c) / .2); }
  .composer textarea { width: 100%; resize: none; background: transparent; border: 0; outline: none; color: rgb(var(--c)); font: 14px/22px system-ui, -apple-system, sans-serif; padding: 12px; height: 46px; }
  .composer textarea::placeholder { color: rgb(var(--c) / .4); }
  .ctool { display: flex; align-items: center; gap: 4px; padding: 0 8px 8px; }
  .mpill { height: 26px; display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 0 6px; background: var(--sel); font-size: 11px; }
  .mpill .dim { color: rgb(var(--c) / .5); }
  .tbtn { width: 26px; height: 26px; border-radius: 6px; background: var(--sel); color: rgb(var(--c) / .5); display: grid; place-items: center; }
  .effort { display: inline-flex; gap: 2px; align-items: flex-end; height: 26px; padding: 0 6px; }
  .effort i { width: 3px; border-radius: 1px; background: rgb(var(--c) / .2); }
  .effort i.on { background: rgb(var(--c) / .8); }
  .send { width: 26px; height: 26px; border-radius: 6px; background: #fff; color: #000; display: grid; place-items: center; margin-left: auto; transition: background-color 120ms ease, transform 100ms var(--ease); }
  .send:active { transform: scale(.94); }
  .footer { display: flex; align-items: center; gap: 6px; font-size: 11px; color: rgb(var(--c) / .55); padding: 2px 4px 0; }
  .footer .wp { height: 24px; display: inline-flex; align-items: center; gap: 6px; padding: 0 6px; font-size: 12px; border-radius: 6px; }
  .footer .br { font: 10px var(--mono); }
  .footer .r { margin-left: auto; font-variant-numeric: tabular-nums; }

  /* ---------- popover / menu / toast ---------- */
  .pop { position: fixed; z-index: 40; background: color-mix(in srgb, var(--bg) 95%, transparent); backdrop-filter: blur(24px); border: 1px solid rgb(var(--c) / .1); border-radius: 12px; box-shadow: 0 20px 25px -5px rgb(0 0 0 / .4), 0 8px 10px -6px rgb(0 0 0 / .4); padding: 4px; min-width: 200px; opacity: 0; transform: scale(.97); transform-origin: var(--o, top left); transition: opacity 120ms ease, transform 160ms var(--ease); pointer-events: none; }
  .pop.show { opacity: 1; transform: none; pointer-events: auto; }
  .pop .ml { font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .04em; color: rgb(var(--c) / .4); padding: 6px 8px 4px; }
  .pop .mi { height: 28px; display: flex; align-items: center; gap: 8px; border-radius: 8px; padding: 0 8px; font-size: 12px; width: 100%; }
  .pop .mi:hover, .pop .mi:focus-visible { background: rgb(var(--c) / .1); outline: none; }
  .pop .mi .r { margin-left: auto; font-size: 11px; color: rgb(var(--c) / .4); }
  .pop .mi.cur { background: rgb(var(--c) / .06); }
  .pop .note { font-size: 11px; color: rgb(var(--c) / .4); padding: 4px 8px 6px; max-width: 260px; }
  .toasts { position: fixed; top: 48px; right: 12px; display: flex; flex-direction: column; gap: 8px; z-index: 50; width: min(340px, calc(100vw - 24px)); }
  .toast { border-radius: 12px; background: color-mix(in srgb, var(--bg) 95%, transparent); backdrop-filter: blur(24px); box-shadow: 0 0 0 1px rgb(var(--c) / .1), 0 20px 25px -5px rgb(0 0 0 / .4); padding: 12px 14px; font-size: 13px; display: flex; gap: 10px; align-items: center; animation: tin 200ms var(--ease); }
  .toast.out { animation: tout 160ms ease forwards; }
  .toast .m { font-size: 10px; color: rgb(var(--c) / .4); display: block; margin-top: 2px; }
  .toast .grow { min-width: 0; }
  .toast button { font-size: 12px; color: var(--accent); padding: 2px 6px; border-radius: 6px; }
  .toast button:hover { background: rgb(var(--c) / .08); }
  @keyframes tin { from { opacity: 0; transform: translateY(-6px); } }
  @keyframes tout { to { opacity: 0; transform: translateX(8px); } }
  .tip { position: fixed; z-index: 60; background: color-mix(in srgb, var(--bg) 95%, transparent); border: 1px solid rgb(var(--c) / .1); border-radius: 8px; padding: 6px 8px; font-size: 11px; color: rgb(var(--c) / .7); pointer-events: none; opacity: 0; transition: opacity 100ms ease; max-width: 280px; }

  .sim button { font-size: 12px; color: rgb(var(--c) / .5); padding: 4px 8px; border-radius: 6px; width: 100%; }

  @media (max-width: 760px) {

<script>
/* ---------- data ---------- */
const STATUS = {
  todo: "Not started",
  progress: "In progress",
  built: "Built, not merged",
  blocked: "Blocked",
  done: "Done",
};

function seed()
{
  return {
    view: { kind: "home", project: "yap" },
    projects: [
      { id: "yap", name: "Yap", color: "linear-gradient(140deg,#f6c177,#eb6f92)", letter: "Y", plan: "docs/plan.md", spend: 4.2,
        handoff: { text: "Phase 3 calendar view is in. Search and the daily reminder are next; Phase 1 waits on your journalling.", age: "2h", by: "Find it later: search" } },
      { id: "glow", name: "Glow-up", color: "#a78bfa", letter: "G", plan: "docs/roadmap.md", spend: 11.8, hot: true, phaseLabel: "Phase 2 · Sync", done: 3, total: 6,
        handoff: { text: "Firestore rules written; waiting on your approval to deploy to staging.", age: "20m", by: "Rules + sync" } },
      { id: "clear", name: "Clearroll", color: "#22d3ee", letter: "C", plan: null, spend: 2.1,
        handoff: { text: "Picker and crop flow done. Three icon drafts made; you pick one.", age: "1h", by: "App icon" } },
      { id: "mono", name: "MonoCode", color: "#3b82f6", letter: "M", plan: null, spend: 6.4,
        handoff: { text: "Kickoff stuck fix pushed; merge to mine pending.", age: "12h", by: "Kick-off broke" } },
      { id: "trade", name: "Trading", color: "#22c55e", letter: "T", plan: "docs/plan.md", spend: 0.4, phaseLabel: "Phase 1 · Paper trading", done: 1, total: 5,
        handoff: { text: "Backtest harness merged.", age: "3d", by: "Backtests" } },
    ],
    sessions: [
      { id: "s1", project: "yap", phase: "1", title: "Phase 1 Daily writer", state: "idle", tm: "2d", last: "Built and tested on the phone. Waiting on you to journal on it for a day before merging." },
      { id: "s2", project: "yap", phase: "2", title: "Full Markdown + format bar", state: "waiting", tm: "5h", last: "Phone test passed. Want me to commit and open the merge?" },
      { id: "s3", project: "yap", phase: "3", title: "Find it later: search", state: "working", tm: "now", last: "Calendar view is in. Running the search UI tests on the shared emulator." },
      { id: "s4", project: "yap", phase: "3", title: "Daily reminder", state: "working", tm: "now", last: "Wiring WorkManager for the 8 pm reminder." },
      { id: "s5", project: "yap", phase: null, title: "Journal scratch notes to flower press", state: "done", tm: "1d", last: "Moved 14 scratch notes into the flower press folder." },
      { id: "s6", project: "yap", phase: null, title: "Onboarding flow", state: "working", tm: "now", last: "Drafting the three welcome screens." },
      { id: "g1", project: "glow", phase: "2", title: "Rules + sync", state: "waiting", tm: "20m", last: "Needs approval: deploy Firestore rules to staging?" },
      { id: "c1", project: "clear", phase: null, title: "App icon", state: "idle", tm: "1h", last: "Three drafts in assets/icon-drafts. Which one?" },
      { id: "c2", project: "clear", phase: null, title: "Crop flow", state: "done", tm: "3h", last: "Crop and rotate done, tests pass." },
      { id: "m1", project: "mono", phase: null, title: "Kick-off broke", state: "done", tm: "12h", last: "Fix pushed. Merge to mine when the mine worktree is free." },
    ],
    waits: [
      { id: "w1", project: "yap", phase: "1", session: "s1", kind: "Your step", text: "Journal on the Phase 1 build for a day", age: "2d", mins: 2880 },
      { id: "w2", project: "yap", phase: "2", session: "s2", kind: "Question", text: "Commit the Markdown work and open the merge?", age: "5h", mins: 300 },
      { id: "w3", project: "glow", phase: "2", session: "g1", kind: "Approval", text: "Deploy Firestore rules to staging", age: "20m", mins: 20 },
      { id: "w4", project: "clear", phase: null, session: "c1", kind: "Your step", text: "Pick one of three icon drafts", age: "1h", mins: 60 },
    ],
    phases: [
      { id: "0.0", name: "Mockups", status: "done", set: "Sam · 2 Nov", what: "Clickable looks, closing moment, garden, themes.", checks: [["Sam picks a look", 1, "Sam"]] },
      { id: "0.1", name: "Android setup", status: "done", set: "Setup chat · 3 Nov", what: "Kotlin + Compose project, tests, lint, release build on your phone.", checks: [["App installs from a one-line command", 1, "Setup chat"]] },
      { id: "0.2", name: "Feel test", status: "done", set: "Sam · 6 Nov", what: "Measure opening, live Markdown on a long note, one garden animation.", checks: [["Open to typing under 1 s", 1, "Feel test chat"], ["No typing lag at 10,000 words", 1, "Feel test chat"], ["You like the feel", 1, "Sam"]] },
      { id: "1", name: "Daily writer", status: "built", set: "Phase 1 chat · 2d", what: "New note on every open, autosave, discard empties, open previous note, screenshots and file attachments.", checks: [["You can journal offline", 1, "Phase 1 chat"], ["Attached screenshots and files reopen", 1, "Phase 1 chat"], ["Nothing is lost after killing the app", 0]] },
      { id: "2", name: "Full Markdown", status: "progress", set: "Markdown chat · 5h", what: "All Markdown elements, format bar.", checks: [["Every element renders live", 1, "Markdown chat"], ["Survives save and reload", 1, "Markdown chat"]] },
      { id: "3", name: "Find it later", status: "progress", set: "Search chat · 12m", what: "Auto dates, calendar, search, stats, reminders.", checks: [["You find an old note in seconds", 0], ["One reminder a day", 0]] },
      { id: "4", name: "Rewards", status: "todo", what: "Closing moment, then garden, then unlocks and customising.", checks: [["Each note grows a plant", 0], ["Everything can be turned off", 0]] },
      { id: "5", name: "Landing and server", status: "todo", what: "yap.clupai.com page and waitlist, first server.", checks: [["Page is live", 0], ["A health check reaches the database", 0]] },
      { id: "6", name: "Sync and AI", status: "todo", what: "Paid-tier sync, opt-in AI: tags, weekly letter, ask, patterns, voice.", checks: [["Notes restore on a new phone", 0], ["AI sees nothing until switched on", 0]] },
      { id: "7", name: "Public launch", status: "todo", what: "Sign-in, Play billing, privacy page, free export, final name check.", checks: [["Approved on the Play Store", 0]] },
    ],
    suggest: {},
    openTouched: {},
  };
}

let S = seed();
let undoSnap = null;
let gen = 0;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const snap = () => structuredClone(S);
const proj = (id) => S.projects.find((p) => p.id === id);
const sess = (id) => S.sessions.find((s) => s.id === id);
const phase = (id) => S.phases.find((p) => p.id === id);
const icon = (id, cls = "i") => `<svg class="${cls}"><use href="#${id}"/></svg>`;
const logo = (p, extra = "") => `<span class="logo ${extra}" style="background:${p.color}">${p.letter}</span>`;

function waitsFor(project)
{
  return S.waits.filter((w) => w.project === project).sort((a, b) => b.mins - a.mins);
}

function phaseOpen(p)
{
  if (p.id in S.openTouched) {
    return S.openTouched[p.id];
  }
  const live = S.sessions.some((s) => s.phase === p.id && s.project === "yap" && (s.state === "working" || s.state === "waiting"));
  const asks = S.waits.some((w) => w.project === "yap" && w.phase === p.id);
  return live || asks;
}

/* ---------- sidebar + tabs ---------- */

function renderSide()
{
  const v = S.view;
  $("#railAll").classList.toggle("on", v.kind === "all");
  $("#railAllCnt").textContent = S.waits.length ? S.waits.length + " waiting" : "";
  $("#projList").innerHTML = S.projects.map((p) => {
    const n = S.waits.filter((w) => w.project === p.id).length;
    const sel = v.project === p.id && v.kind !== "all";
    const list = sel ? `<div class="sess-list">${S.sessions.filter((s) => s.project === p.id).map((s) =>
      `<button class="sess ${v.kind === "chat" && v.session === s.id ? "on" : ""}" data-chat="${s.id}"><span class="st ${s.state}"></span><span class="t">${s.title}</span><span class="tm">${s.tm}</span></button>`).join("")}</div>` : "";
    return `<button class="proj ${sel && v.kind === "home" ? "on" : ""}" data-home="${p.id}">${logo(p)}<span class="nm">${p.name}</span>${n ? `<span class="needs" title="${n} waiting on you">${n}</span>` : ""}</button>${list}`;
  }).join("");
}

function renderTabs()
{
  const v = S.view;
  const tabs = [];
  if (v.kind === "all") {
    tabs.push(`<button class="tab on">${icon("grid", "i i-14 pi")}<span class="t">All projects</span></button>`);
  } else {
    const p = proj(v.project);
    tabs.push(`<button class="tab ${v.kind === "home" ? "on" : ""}" data-home="${p.id}">${icon("grid", "i i-14 pi")}<span class="t">${p.name}</span></button>`);
    S.sessions.filter((s) => s.project === p.id && (s.state !== "done" || (v.kind === "chat" && v.session === s.id))).slice(0, 3).forEach((s) => {
      tabs.push(`<button class="tab ${v.kind === "chat" && v.session === s.id ? "on" : ""}" data-chat="${s.id}"><span class="claude pi">✳</span><span class="t">${s.title}</span></button>`);
    });
  }
  $("#tabs").innerHTML = tabs.join("") + `<button class="tab-add" aria-label="New tab">${icon("plus", "i i-14")}</button>`;
}

/* ---------- all projects ---------- */

function renderAll()
{
  const waits = [...S.waits].sort((a, b) => b.mins - a.mins);
  const total = S.projects.reduce((a, p) => a + p.spend, 0);
  $("#v-all").innerHTML = `<div class="page">
    <div class="ph-header"><div><h1>All projects</h1>
      <div class="subline"><span>${waits.length} waiting on you</span><span>·</span><span>${S.sessions.filter((s) => s.state === "working").length} chats working</span><span>·</span><span>$${total.toFixed(2)} today</span></div></div></div>
    <section><div class="h2">Waiting on you <span class="pill amber">${waits.length}</span><span class="grow"></span><span>oldest first</span></div>
      <div class="rows">${waits.length ? waits.map((w) => waitRow(w, true)).join("") : '<div class="row"><span class="sub">Nothing needs you. Agents are on it.</span></div>'}</div></section>
    <section><div class="h2">Projects</div><div class="rows">${S.projects.map(projRow).join("")}</div></section>
  </div>`;
}

function projRow(p)
{
  const n = S.waits.filter((w) => w.project === p.id).length;
  const live = S.sessions.filter((s) => s.project === p.id && s.state === "working").length;
  let ph = "No plan yet";
  if (p.id === "yap") {
    const cur = S.phases.filter((x) => x.status !== "done");
    const done = S.phases.length - cur.length;
    const now = cur.find((x) => x.status === "progress") || cur[0];
    ph = now ? `Phase ${now.id} · ${now.name} · ${done} of ${S.phases.length} done` : "All phases done";
  } else if (p.phaseLabel) {
    ph = `${p.phaseLabel} · ${p.done} of ${p.total} done`;
  }
  return `<button class="row proj-row" data-home="${p.id}">${logo(p)}
    <div class="body"><div class="ttl">${p.name} <span class="ph">· ${ph}</span></div><div class="sub"><span>${p.handoff.text}</span></div></div>
    ${live ? `<span class="age-chip"><span class="st working" style="display:inline-grid;vertical-align:-4px"></span>${live}</span>` : ""}
    ${n ? `<span class="needs">${n}</span>` : ""}
    <span class="spend ${p.hot ? "hot" : ""}" title="${p.hot ? "Spending faster than usual today" : "Spend today"}">$${p.spend.toFixed(2)}</span></button>`;
}

function waitRow(w, showProject)
{
  const p = proj(w.project);
  const s = sess(w.session);
  const ended = s.state === "idle" || s.state === "done";
  return `<button class="row wait" data-wait="${w.id}">
    ${showProject ? logo(p) : `<span class="st waiting"></span>`}
    <div class="body"><div class="ttl">${w.text}</div>
      <div class="sub">${showProject ? `<span>${p.name}</span><span>·</span>` : ""}${w.phase ? `<span>Phase ${w.phase}</span><span>·</span>` : ""}<span>${s.title}</span>${ended ? '<span class="tag" title="The chat is not running. Replying wakes it.">chat idle</span>' : ""}</div></div>
    <span class="tag">${w.kind}</span>
    <span class="age-chip ${w.mins >= 1440 ? "old" : ""}">${w.age}</span>
    <span class="go">Open chat ${icon("enter", "i i-sm")}</span></button>`;
}

/* ---------- project home ---------- */

function renderHome()
{
  const p = proj(S.view.project);
  if (!p.plan) {
    renderNoPlan(p);
    return;
  }
  if (p.id !== "yap") {
    $("#v-home").innerHTML = `<div class="page"><div class="ph-header">${logo(p)}<div><h1>${p.name}</h1><div class="subline">${p.phaseLabel} · ${p.done} of ${p.total} done</div></div></div>
      <div class="handoff"><span class="k">Handoff</span><span class="txt">${p.handoff.text}</span><span class="age">${p.handoff.age}</span></div>
      <section><div class="h2">Waiting on you</div><div class="rows">${waitsFor(p.id).map((w) => waitRow(w)).join("")}</div></section>
      <div class="loose">This mockup only fills in Yap's roadmap.</div></div>`;
    return;
  }
  const done = S.phases.filter((x) => x.status === "done").length;
  const cur = S.phases.find((x) => x.status === "progress") || S.phases.find((x) => x.status !== "done");
  const waits = waitsFor("yap");
  const loose = S.sessions.filter((s) => s.project === "yap" && !s.phase);
  $("#v-home").innerHTML = `<div class="page">
    <div class="ph-header">${logo(p)}<div><h1>${p.name}</h1>
      <div class="subline"><span>Now: Phase ${cur.id} · ${cur.name}</span><span>·</span><span>${done} of ${S.phases.length} done</span><span>·</span><span>${S.sessions.filter((s) => s.project === "yap" && s.state === "working").length} chats working</span><span>·</span><span>$${p.spend.toFixed(2)} today</span></div></div>
      <span class="grow"></span><button class="btn2" data-toast="Opens docs/plan.md in the file viewer">${icon("file", "i i-14")}<span class="mono">plan.md</span></button></div>
    <div class="handoff"><span class="k">Handoff</span><span class="txt">${p.handoff.text}</span><span class="age" title="From .claude/handoff.md, written by “${p.handoff.by}”">${p.handoff.age}</span></div>
    <section><div class="h2">Waiting on you ${waits.length ? `<span class="pill amber">${waits.length}</span>` : ""}</div>
      <div class="rows">${waits.length ? waits.map((w) => waitRow(w)).join("") : '<div class="row"><span class="sub">Nothing needs you on Yap.</span></div>'}</div></section>
    <section><div class="h2">Roadmap <span class="grow"></span><span>open: phases with a live chat or a wait</span></div>
      <div id="phases">${S.phases.map(phaseRow).join("")}</div>
      ${loose.length ? `<div class="h2" style="margin-top:14px">Chats not on a phase</div><div class="chips" style="padding:0 8px">${loose.map((s) => chip(s, true)).join("")}</div>` : ""}
    </section>
  </div>`;
}

function chip(s, link)
{
  return `<button class="chip" data-chat="${s.id}" ${link ? `data-linkmenu="${s.id}"` : ""} data-tip="${s.last}"><span class="st ${s.state}"></span>${s.title}<span class="tm">${s.tm}</span></button>`;
}

function phaseRow(p)
{
  const open = phaseOpen(p);
  const chats = S.sessions.filter((s) => s.project === "yap" && s.phase === p.id);
  const live = chats.filter((s) => s.state !== "done" && s.state !== "idle");
  const asks = S.waits.filter((w) => w.project === "yap" && w.phase === p.id);
  const newest = chats.find((s) => s.state === "working") || chats.find((s) => s.state === "waiting") || chats[0];
  const allMet = p.checks.every((c) => c[1]);
  const sug = S.suggest[p.id] || (allMet && p.status !== "done" ? "checks" : null);
  let sugHtml = "";
  if (sug && p.status !== "done") {
    const why = sug === "merged" ? "Branch merged into main" : "Every done-when is met";
    sugHtml = `<div class="suggest"><span>Looks done. <span class="why">${why} · a suggestion, nothing changes until you say so</span></span><button class="btn2" data-setstatus="${p.id}:done" style="color:var(--emerald-300);border-color:rgb(52 211 153 / .3)">Mark done</button></div>`;
  }
  return `<div class="phase s-${p.status} ${open ? "open" : ""}" data-phase="${p.id}">
    <div class="phase-head">
      <button data-toggle="${p.id}" style="display:flex;align-items:center;gap:10px;flex:1;min-width:0" aria-expanded="${open}">
        <span class="glyph g-${p.status}"></span><span class="pnum">${p.id}</span><span class="pname">${p.name}</span>
      </button>
      ${asks.length ? `<span class="needs-pill">Needs you</span>` : ""}
      ${live.length ? `<span class="pchats">${live.map((s) => `<span class="st ${s.state}"></span>`).join("")}</span>` : ""}
      ${p.status === "todo" ? `<button class="btn2 start" data-start="${p.id}">Start</button>` : ""}
      <button class="pstatus" data-statusmenu="${p.id}" data-tip="${p.set ? "Set by " + p.set + ". Click to change." : "Click to set status"}">${STATUS[p.status]}</button>
      <button data-toggle="${p.id}" aria-label="Expand" style="display:grid;place-items:center;width:20px;height:20px">${icon("chev", "i i-14 chev")}</button>
    </div>
    <div class="pbody"><div class="pinner"><div class="pcontent">
      <p class="what">${p.what}</p>
      ${newest ? `<div class="quote">“${newest.last}”<small>${newest.title} · ${newest.tm}</small></div>` : ""}
      ${sugHtml}
      <div><div class="lbl">Done when · kept up to date by the chats</div><div class="checks">${p.checks.map((c) =>
        `<div class="chk ${c[1] ? "on" : ""}"><span class="circ ${c[1] ? "on" : ""}"></span><span class="ct">${c[0]}</span>${c[1] && c[2] ? `<span class="by">· ${c[2]}</span>` : ""}</div>`).join("")}</div></div>
      ${chats.length ? `<div><div class="lbl">Chats</div><div class="chips">${chats.map((s) => chip(s)).join("")}</div></div>` : ""}
      <div class="pactions">${p.status !== "done" ? `<button class="btn2" data-start="${p.id}">${icon("plus", "i i-14")}New chat for this phase</button>` : ""}</div>
    </div></div></div>
  </div>`;
}

function renderNoPlan(p)
{
  const chats = S.sessions.filter((s) => s.project === p.id);
  $("#v-home").innerHTML = `<div class="page">
    <div class="ph-header">${logo(p)}<div><h1>${p.name}</h1><div class="subline"><span>No plan yet</span><span>·</span><span>${chats.length} chats</span><span>·</span><span>$${p.spend.toFixed(2)} today</span></div></div>
      <span class="grow"></span><button class="btn1" data-draft="${p.id}">${icon("spark", "i i-14")}Draft a plan from these chats</button></div>
    <div class="handoff"><span class="k">Handoff</span><span class="txt">${p.handoff.text}</span><span class="age">${p.handoff.age}</span></div>
    <section><div class="h2">Waiting on you</div><div class="rows">${waitsFor(p.id).length ? waitsFor(p.id).map((w) => waitRow(w)).join("") : '<div class="row"><span class="sub">Nothing needs you here.</span></div>'}</div></section>
    <section><div class="h2">Chats</div><div class="rows">${chats.map((s) => `<button class="row" data-chat="${s.id}"><span class="st ${s.state}"></span><div class="body"><div class="ttl">${s.title}</div><div class="sub"><span>${s.last}</span></div></div><span class="age-chip">${s.tm}</span></button>`).join("")}</div></section>
  </div>`;
}

/* ---------- chat ---------- */

function renderChat(focusWait)
{
  const s = sess(S.view.session);
  const p = proj(s.project);
  const ph = s.phase ? phase(s.phase) : null;
  const asks = S.waits.filter((w) => w.session === s.id);
  const stripPhase = ph && s.project === "yap"
    ? `<span class="glyph g-${ph.status}"></span><span>${p.name}</span><span style="opacity:.5">›</span><b>Phase ${ph.id} · ${ph.name}</b>`
    : `<span>${p.name}</span><span style="opacity:.5">›</span><b>${p.plan ? "Not on a phase" : "No plan yet"}</b>`;
  $("#v-chat").innerHTML = `<div class="chat">
    <div class="strip-wrap"><button class="strip" id="strip" aria-expanded="false">${stripPhase}${asks.length ? '<span class="needs-pill">Needs you</span>' : ""}${icon("chev", "i i-sm")}</button></div>
    <div class="transcript"><div class="tx">
      <div class="u">${s.id === "s1" ? "Build Phase 1 from plan.md." : "Carry on with " + (ph ? "Phase " + ph.id : "this") + "."}</div>
      <div class="a"><p>${s.last}</p></div>
      ${asks.map((w) => `<div class="ask-card ${focusWait === w.id ? "hl" : ""}" id="ask-${w.id}">${w.kind === "Your step" ? `<button class="circ" data-tickwait="${w.id}" aria-label="Mark done"></button>` : '<span class="st waiting" style="margin-top:1px"></span>'}
        <div><div>${w.text}</div><div class="w">${w.kind === "Your step" ? "On your checklist · tick when done" : "Reply below to answer · waiting " + w.age}</div></div></div>`).join("")}
    </div></div>
    <div class="composer-wrap"><div class="composer">
      <textarea id="ta" placeholder="Ask, build, / for commands, @ for references..."></textarea>
      <div class="ctool"><button class="tbtn">${icon("plus", "i i-14")}</button><span class="mpill"><span class="claude">✳</span>Opus 5.5<span class="dim">Low</span></span>
        <span class="effort"><i class="on" style="height:5px"></i><i style="height:8px"></i><i style="height:11px"></i><i style="height:14px"></i></span>
        <button class="send" id="send" aria-label="Send">${icon("arrow", "i i-14")}</button></div>
    </div>
    <div class="footer"><span class="wp">${icon("folder", "i i-14")}Current checkout</span><span class="wp">${icon("branch", "i i-sm")}<span class="br">${ph ? "step-" + ph.id + "-" + ph.name.toLowerCase().replace(/ /g, "-") : "main"}</span></span><span class="r">100K · 40% · 4 compactions</span></div></div>
  </div>`;
  if (focusWait) {
    const el = $("#ask-" + focusWait);
    if (el) {
      el.scrollIntoView({ block: "center" });
    }
    $("#ta").focus();
  }
}

/* ---------- render + nav ---------- */

function render(opts = {})
{
  const v = S.view;
  $("#v-all").hidden = v.kind !== "all";
  $("#v-home").hidden = v.kind !== "home";
  $("#v-chat").hidden = v.kind !== "chat";
  renderSide();
  renderTabs();
  if (v.kind === "all") {
    renderAll();
  } else if (v.kind === "home") {
    renderHome();
  } else {
    renderChat(opts.focusWait);
  }
}

function nav(view, opts)
{
  closePop();
  S.view = view;
  render(opts);
  if (!opts || !opts.keepScroll) {
    $$(".view").forEach((v) => (v.scrollTop = 0));
  }
}

function toast(msg, meta, withUndo)
{
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<div class="grow">${msg}${meta ? `<span class="m">${meta}</span>` : ""}</div>${withUndo ? "<button>Undo</button>" : ""}`;
  $("#toasts").prepend(el);
  const kill = () => {
    el.classList.add("out");
    setTimeout(() => el.remove(), 170);
  };
  if (withUndo) {
    const back = undoSnap;
    $("button", el).onclick = () => {
      gen++;
      S = back;
      S.view = structuredClone(S.view);
      render({ keepScroll: true });
      kill();
    };
  }
  setTimeout(kill, 5000);
}

function act(msg, meta, fn)
{
  undoSnap = snap();
  fn();
  render({ keepScroll: true });
  toast(msg, meta, true);
}

/* ---------- popovers ---------- */
let pop = null;

function showPop(html, anchor, align)
{
  closePop();
  const el = $("#pop");
  el.innerHTML = html;
  const r = anchor.getBoundingClientRect();
  el.classList.add("show");
  const w = el.offsetWidth;
  const left = align === "right" ? r.right - w : r.left;
  el.style.left = Math.max(8, Math.min(left, innerWidth - w - 8)) + "px";
  el.style.top = r.bottom + 4 + "px";
  el.style.setProperty("--o", align === "right" ? "top right" : "top left");
  pop = anchor;
  anchor.setAttribute("aria-expanded", "true");
  const first = $(".mi", el);
  if (first) {
    first.focus({ preventScroll: true });
  }
}

function closePop()
{
  if (!pop) {
    return;
  }
  $("#pop").classList.remove("show");
  pop.setAttribute("aria-expanded", "false");
  pop = null;
}

function statusMenu(id, anchor)
{
  const p = phase(id);
  showPop(`<div class="ml">Phase ${p.id} status</div>` + Object.keys(STATUS).map((k) =>
    `<button class="mi ${p.status === k ? "cur" : ""}" data-setstatus="${id}:${k}"><span class="glyph g-${k}"></span>${STATUS[k]}${p.status === k ? '<span class="r">now</span>' : ""}</button>`).join("")
    + `<div class="note">Writes the Status cell in plan.md, so every agent sees it.${p.set ? " Last set by " + p.set + "." : ""}</div>`, anchor, "right");
}

function linkMenu(sid, anchor)
{
  showPop(`<div class="ml">Put on a phase</div>` + S.phases.filter((p) => p.status !== "done").map((p) =>
    `<button class="mi" data-link="${sid}:${p.id}"><span class="glyph g-${p.status}"></span>${p.id} ${p.name}</button>`).join("")
    + `<button class="mi" data-chat="${sid}">Open chat<span class="r">↵</span></button>`, anchor, "left");
}

function roadPop(anchor)
{
  const s = sess(S.view.session);
  const p = proj(s.project);
  if (p.id !== "yap") {
    showPop(`<div class="ml">${p.name}</div><button class="mi" data-home="${p.id}">Open project home</button>`, anchor);
    return;
  }
  const done = S.phases.filter((x) => x.status === "done").length;
  showPop(`<div class="ml">Yap · ${done} of ${S.phases.length} done</div>` + S.phases.map((x) =>
    `<button class="mi ${x.id === s.phase ? "cur" : ""}" data-gophase="${x.id}"><span class="glyph g-${x.status}"></span>${x.id} ${x.name}${S.waits.some((w) => w.project === "yap" && w.phase === x.id) ? '<span class="r" style="color:var(--amber-400)">needs you</span>' : `<span class="r">${STATUS[x.status]}</span>`}</button>`).join("")
    + `<button class="mi" data-home="yap">${icon("grid", "i i-14")}Open Yap home</button>`, anchor);
}

/* ---------- actions ---------- */

function setStatus(id, k)
{
  const p = phase(id);
  if (p.status === k) {
    closePop();
    return;
  }
  act(`Phase ${id} → ${STATUS[k]}`, "Written to docs/plan.md · set by Sam", () => {
    p.status = k;
    p.set = "Sam · just now";
    delete S.suggest[id];
    if (k === "done") {
      p.checks.forEach((c) => {
        if (!c[1]) {
          c[1] = 1;
          c[2] = "Sam";
        }
      });
      S.waits = S.waits.filter((w) => !(w.project === "yap" && w.phase === id));
      S.openTouched[id] = false;
    }
  });
  closePop();
  const row = $(`.phase[data-phase="${id}"]`);
  if (row) {
    row.classList.add("changed");
  }
}

function startPhase(id, btn)
{
  btn.disabled = true;
  btn.textContent = "Starting…";
  const g = gen;
  setTimeout(() => {
    if (g !== gen) {
      return;
    }
    const p = phase(id);
    const sid = "n" + Date.now();
    undoSnap = snap();
    S.sessions.push({ id: sid, project: "yap", phase: id, title: p.name, state: "working", tm: "now", last: `Reading the Phase ${id} brief and done-when from plan.md…` });
    if (p.status === "todo") {
      p.status = "progress";
      p.set = "Started by Sam · now";
    }
    S.openTouched[id] = true;
    render({ keepScroll: true });
    toast(`New chat for Phase ${id}`, "Seeded with the brief and done-when · linked to the phase", true);
  }, 600);
}

function resolveWait(wid, how)
{
  const w = S.waits.find((x) => x.id === wid);
  if (!w) {
    return;
  }
  undoSnap = snap();
  const s = sess(w.session);
  S.waits = S.waits.filter((x) => x.id !== wid);
  s.state = "working";
  s.tm = "now";
  if (wid === "w1") {
    phase("1").checks[2][1] = 1;
    phase("1").checks[2][2] = "Sam";
    s.last = "Thanks. Nothing was lost after the kill test. Ready to merge.";
  } else if (wid === "w2") {
    s.last = "Committing on step-2-full-markdown and opening the merge…";
  } else {
    s.last = how ? `On it: “${how}”` : "On it.";
  }
  render({ keepScroll: true });
  toast(how ? "Reply sent" : "Ticked off", `${s.title} is working again`, true);
}

function simulate(kind)
{
  if (kind === "approve") {
    const s = sess("s4");
    if (s.state === "waiting") {
      return;
    }
    act("Daily reminder needs approval", "Run the reminder migration?", () => {
      s.state = "waiting";
      s.tm = "now";
      s.last = "Needs approval: run the database migration for reminders?";
      S.waits.push({ id: "w" + Date.now(), project: "yap", phase: "3", session: "s4", kind: "Approval", text: "Run the reminder database migration", age: "now", mins: 0 });
    });
  } else if (kind === "finish") {
    act("Find it later: search finished", "Calendar and search done", () => {
      const s = sess("s3");
      s.state = "done";
      s.tm = "now";
      s.last = "Search done, tests pass. You can find any note by word or date.";
      phase("3").checks[0][1] = 1;
      phase("3").checks[0][2] = "Search chat";
    });
  } else if (kind === "merge") {
    act("Phase 2 branch merged into main", "Suggested done; status unchanged", () => {
      S.suggest["2"] = "merged";
      S.openTouched["2"] = true;
    });
  } else if (kind === "reset") {
    gen++;
    S = seed();
    render();
  }
}

/* ---------- events ---------- */

document.addEventListener("click", (e) => {
  const t = e.target.closest("button, [data-tip]") || e.target;
  const d = t.dataset || {};
  if (pop && !$("#pop").contains(e.target) && !pop.contains(e.target)) {
    closePop();
  }
  if (d.setstatus) {
    const [id, k] = d.setstatus.split(":");
    setStatus(id, k);
  } else if (d.statusmenu) {
    statusMenu(d.statusmenu, t);
  } else if (d.link) {
    const [sid, pid] = d.link.split(":");
    closePop();
    act(`Put on Phase ${pid}`, sess(sid).title, () => {
      sess(sid).phase = pid;
      S.openTouched[pid] = true;
    });
  } else if (d.linkmenu && !e.metaKey) {
    linkMenu(d.linkmenu, t);
  } else if (d.wait) {
    const w = S.waits.find((x) => x.id === d.wait);
    nav({ kind: "chat", project: w.project, session: w.session }, { focusWait: w.id });
  } else if (d.tickwait) {
    t.classList.add("on");
    const g = gen;
    setTimeout(() => {
      if (g === gen) {
        resolveWait(d.tickwait);
      }
    }, 220);
  } else if (d.chat) {
    const s = sess(d.chat);
    nav({ kind: "chat", project: s.project, session: s.id });
  } else if (d.home) {
    nav({ kind: "home", project: d.home });
  } else if (d.nav === "all") {
    nav({ kind: "all" });
  } else if (d.toggle) {
    const p = phase(d.toggle);
    const now = !phaseOpen(p);
    S.openTouched[p.id] = now;
    const row = $(`.phase[data-phase="${p.id}"]`);
    row.classList.toggle("open", now);
    $$("[aria-expanded]", row).forEach((b) => b.setAttribute("aria-expanded", now));
  } else if (d.start) {
    startPhase(d.start, t);
  } else if (d.gophase) {
    nav({ kind: "home", project: "yap" });
    const p = phase(d.gophase);
    S.openTouched[p.id] = true;
    render();
    const row = $(`.phase[data-phase="${p.id}"]`);
    row.scrollIntoView({ block: "center" });
    row.classList.add("flash");
  } else if (d.draft) {
    toast("Drafting a plan…", "A chat reads the handoff and chat notes, then shows you a phase table to approve", false);
  } else if (d.toast) {
    toast(d.toast);
  } else if (d.sim) {
    simulate(d.sim);
  } else if (t.id === "strip") {
    if (pop === t) {
      closePop();
    } else {
      roadPop(t);
    }
  } else if (t.id === "send") {
    sendReply();
  }
});

function sendReply()
{
  const ta = $("#ta");
  const text = ta.value.trim();
  if (!text) {
    ta.focus();
    return;
  }
  const s = sess(S.view.session);
  const w = S.waits.find((x) => x.session === s.id && x.kind !== "Your step");
  if (w) {
    resolveWait(w.id, text);
  } else {
    toast("Sent", s.title);
    ta.value = "";
  }
}

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && pop) {
    const a = pop;
    closePop();
    a.focus();
  } else if (e.key === "Enter" && !e.shiftKey && e.target.id === "ta") {
    e.preventDefault();
    sendReply();
  }
});

/* hover tooltips (provenance, last line) */
let tipTimer = null;
document.addEventListener("mouseover", (e) => {
  const el = e.target.closest("[data-tip]");
  clearTimeout(tipTimer);
  const tip = $("#tip");
  if (!el) {
    tip.classList.remove("show");
    return;
  }
  tipTimer = setTimeout(() => {
    tip.textContent = el.dataset.tip;
    const r = el.getBoundingClientRect();
    tip.classList.add("show");
    tip.style.left = Math.max(8, Math.min(r.left, innerWidth - tip.offsetWidth - 8)) + "px";
    tip.style.top = r.bottom + 6 + "px";
  }, tip.classList.contains("show") ? 0 : 350);
});

if (matchMedia("(max-width: 760px)").matches) {
  S.view = { kind: "all" };
}
render();
</script>
</body>
</html>
