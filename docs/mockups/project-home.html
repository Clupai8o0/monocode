<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MonoCode · Project home (v3)</title>
<style>
  /* Tokens from src/styles/index.css (dark). Sidebar, rows and session cards copy
     src/app/shell/Sidebar.tsx and src/fork/projects/ProjectsList.tsx. */
  :root {
    --bg: hsl(240 0% 9%);
    --side: color-mix(in srgb, hsl(240 0% 9%) 90%, black);
    --c: 235 235 235;
    --stroke: rgb(var(--c) / .07);
    --accent: hsl(211 92% 62%);
    --emerald: #34d399;
    --emerald-2: #6ee7b7;
    --amber: #fbbf24;
    --violet: #a78bfa;
    --red: #f87171;
    --ease: cubic-bezier(.22, 1, .36, 1);
    --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: rgb(var(--c)); }
  body { font-size: 13px; line-height: 1.4; -webkit-font-smoothing: antialiased; overflow: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  button:focus-visible { outline: 1px solid var(--accent); outline-offset: 1px; }
  svg { flex: none; }
  .i { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
  .i12 { width: 12px; height: 12px; }
  .i14 { width: 14px; height: 14px; }
  .nowrap { white-space: nowrap; }
  .trunc { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tab-num { font-variant-numeric: tabular-nums; }

  /* "New" marks what this proposal adds; everything unmarked exists today. */
  .new { display: inline-block; font-size: 9px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--accent); background: color-mix(in srgb, var(--accent) 15%, transparent); border-radius: 4px; padding: 1px 4px; line-height: 12px; flex: none; }

  .app { display: grid; grid-template-columns: 264px minmax(0, 1fr); height: 100vh; }

  /* ---------- inset sidebar ---------- */
  .side { background: var(--side); border-right: 1px solid var(--stroke); display: flex; flex-direction: column; min-height: 0; }
  .side-top { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 14px; flex: none; }
  .tl { width: 12px; height: 12px; border-radius: 50%; background: rgb(var(--c) / .16); }
  .side-top .sp { flex: 1; }
  .ibtn { width: 24px; height: 24px; display: grid; place-items: center; border-radius: 6px; color: rgb(var(--c) / .5); flex: none; transition: background-color 150ms ease, color 150ms ease; }
  .ibtn:hover { background: rgb(var(--c) / .1); color: rgb(var(--c)); }
  .nav { display: flex; flex-direction: column; gap: 1px; padding: 4px 8px 12px; flex: none; }
  .nav-row { height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 6px; font-size: 13px; color: rgb(var(--c) / .7); width: 100%; transition: background-color 150ms ease, color 150ms ease; }
  .nav-row .i { opacity: .7; }
  .nav-row:hover { background: rgb(var(--c) / .05); color: rgb(var(--c)); }
  .nav-row.on { background: rgb(var(--c) / .07); color: rgb(var(--c)); font-weight: 500; }
  .nav-row .r { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 11px; color: rgb(var(--c) / .4); }
  .nav-row kbd { font: 11px var(--mono); color: rgb(var(--c) / .35); }

  .plist { padding: 0 8px 8px; flex: none; }
  .shead { height: 28px; display: flex; align-items: center; gap: 4px; padding: 0 8px; font-size: 12px; font-weight: 500; color: rgb(var(--c) / .5); }
  .shead .sp { flex: 1; }
  .prow { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 6px; width: 100%; transition: background-color 150ms ease; }
  .prow:hover { background: rgb(var(--c) / .05); }
  .prow.on { background: rgb(var(--c) / .07); }
  .plogo { width: 20px; height: 20px; border-radius: 5px; display: grid; place-items: center; font-size: 10px; font-weight: 800; color: #111; flex: none; }
  .prow .txt { flex: 1; min-width: 0; }
  .prow .nm { display: block; font-size: 12px; line-height: 16px; color: rgb(var(--c) / .8); }
  .prow.on .nm { color: rgb(var(--c)); font-weight: 500; }
  .prow .act { display: block; font-size: 10px; line-height: 12px; color: rgb(var(--c) / .45); }
  .counts { display: flex; align-items: center; gap: 6px; font-size: 10px; flex: none; }
  .counts span { display: inline-flex; align-items: center; gap: 2px; }
  .counts .w { color: var(--accent); }
  .counts .w::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .counts .n { color: var(--amber); }
  .counts .d { color: var(--emerald); }

  /* sessions card (ProjectSessionsCard) */
  .scard { margin: 0 8px 8px; border-radius: 12px; background: rgb(var(--c) / .04); display: flex; flex-direction: column; min-height: 0; flex: 1; overflow: hidden; }
  .scard-h { height: 36px; display: flex; align-items: center; gap: 8px; padding: 0 6px 0 12px; flex: none; }
  .scard-h .plogo { width: 16px; height: 16px; font-size: 8px; border-radius: 4px; }
  .scard-h .nm { flex: 1; font-size: 12px; font-weight: 500; color: rgb(var(--c) / .8); }
  .slist { overflow: auto; padding: 0 6px 8px; display: flex; flex-direction: column; gap: 2px; }
  .srow { display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 6px; border: 1px solid transparent; width: 100%; transition: background-color 150ms ease; }
  .srow:hover { background: rgb(var(--c) / .05); }
  .srow.on { background: rgb(var(--c) / .08); border-color: rgb(var(--c) / .08); }
  .srow .t { flex: 1; font-size: 13px; line-height: 1.2; color: rgb(var(--c) / .85); }
  .srow.on .t { color: rgb(var(--c)); }
  .srow.home { margin-bottom: 4px; }
  .srow.home .t { font-weight: 500; }
  .lab { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; white-space: nowrap; color: rgb(var(--c) / .45); flex: none; }
  .lab.waiting { color: var(--amber); }
  .lab.working { color: var(--accent); }
  .lab.done { color: var(--emerald); }
  .spin { display: inline-block; width: 12px; text-align: center; font-size: 11px; line-height: 1; color: var(--accent); }
  .prov { width: 16px; height: 16px; display: grid; place-items: center; flex: none; font-size: 13px; line-height: 1; }
  .prov.claude { color: #d97757; }
  .prov.codex, .prov.grok { color: rgb(var(--c) / .8); }

  .demo { flex: none; padding: 8px; }
  .demo button { width: 100%; height: 30px; display: flex; align-items: center; gap: 8px; padding: 0 8px; border-radius: 6px; font-size: 12px; color: rgb(var(--c) / .55); }
  .demo button:hover { background: rgb(var(--c) / .05); color: rgb(var(--c)); }

  /* ---------- title bar tabs ---------- */
  .main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .tabs { height: 40px; display: flex; align-items: center; gap: 2px; padding: 0 10px; flex: none; border-bottom: 1px solid var(--stroke); overflow: hidden; }
  .tab { height: 30px; display: flex; align-items: center; gap: 6px; padding: 0 10px; border-radius: 6px; font-size: 13px; color: rgb(var(--c) / .5); min-width: 0; max-width: 220px; flex: 0 1 auto; transition: background-color 150ms ease, color 150ms ease; }
  .tab:hover { background: rgb(var(--c) / .05); color: rgb(var(--c)); }
  .tab.on { background: rgb(var(--c) / .1); color: rgb(var(--c)); }
  .tab .t { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab-add { width: 26px; height: 26px; border-radius: 6px; background: rgb(var(--c) / .1); color: rgb(var(--c) / .7); display: grid; place-items: center; margin-left: 4px; flex: none; }
  .tab.pin { flex: none; max-width: none; }
  .mob { display: none; }

  .view { flex: 1; overflow: auto; min-height: 0; container-type: inline-size; }
  .view[hidden] { display: none; }

  /* ---------- page ---------- */
  .page { max-width: 800px; margin: 0 auto; padding: 32px 32px 96px; display: flex; flex-direction: column; gap: 36px; }
  .head { display: flex; align-items: center; gap: 14px; }
  .head .plogo { width: 40px; height: 40px; border-radius: 10px; font-size: 17px; }
  .head .txt { flex: 1; min-width: 0; }
  .head h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -.015em; line-height: 28px; display: flex; align-items: center; gap: 8px; }
  .head .now { font-size: 13px; color: rgb(var(--c) / .6); margin-top: 2px; }
  .head .now b { font-weight: 500; color: rgb(var(--c) / .9); }
  .btns { display: flex; align-items: center; gap: 8px; flex: none; }
  .btn { height: 30px; display: inline-flex; align-items: center; gap: 6px; padding: 0 12px; border-radius: 6px; font-size: 12px; font-weight: 500; white-space: nowrap; flex: none; transition: background-color 150ms ease, transform 100ms var(--ease); }
  .btn:active { transform: scale(.97); }
  .btn.ghost { border: 1px solid rgb(var(--c) / .12); color: rgb(var(--c) / .8); }
  .btn.ghost:hover { background: rgb(var(--c) / .08); color: rgb(var(--c)); }
  .btn.solid { background: #fff; color: #000; }
  .btn.solid:hover { background: rgb(255 255 255 / .88); }
  .btn.sm { height: 26px; padding: 0 10px; font-size: 12px; }
  .btn.green { border-color: rgb(52 211 153 / .35); color: var(--emerald-2); }
  .btn.green:hover { background: rgb(52 211 153 / .1); }

  .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
  .stat { min-width: 0; border-radius: 10px; background: rgb(var(--c) / .04); padding: 12px 14px; }
  .stat .k { font-size: 11px; color: rgb(var(--c) / .5); }
  .stat .v { font-size: 18px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums; letter-spacing: -.01em; }
  .stat .v small { font-size: 12px; font-weight: 400; color: rgb(var(--c) / .45); margin-left: 3px; }
  .stat.amber .v { color: var(--amber); }

  .sec-h { display: flex; align-items: baseline; gap: 8px; margin: 0 0 12px; }
  .sec-h h2 { margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .sec-h .count { font-size: 13px; color: rgb(var(--c) / .4); font-variant-numeric: tabular-nums; }
  .sec-h .count.amber { color: var(--amber); }
  .sec-h .sp { flex: 1; }
  .sec-h .meta { font-size: 12px; color: rgb(var(--c) / .4); white-space: nowrap; }
  .sub-h { font-size: 12px; font-weight: 500; color: rgb(var(--c) / .5); margin: 20px 0 8px; display: flex; gap: 6px; align-items: center; }
  .sec-h + .sub-h { margin-top: 0; }

  .card { border-radius: 12px; background: rgb(var(--c) / .04); }
  .card.pad { padding: 16px 18px; }
  .handoff .k { display: flex; align-items: center; gap: 8px; font-size: 11px; color: rgb(var(--c) / .5); margin-bottom: 6px; }
  .handoff .k .sp { flex: 1; }
  .handoff p { margin: 0; font-size: 14px; line-height: 1.55; color: rgb(var(--c) / .88); text-wrap: pretty; }

  /* list rows inside a card */
  .list { padding: 6px; display: flex; flex-direction: column; gap: 2px; }
  .item { display: flex; align-items: center; gap: 12px; padding: 10px; border-radius: 8px; width: 100%; transition: background-color 150ms ease; }
  button.item:hover { background: rgb(var(--c) / .05); }
  .item .lead { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; flex: none; background: rgb(var(--c) / .06); color: rgb(var(--c) / .6); }
  .item .lead.amber { background: rgb(251 191 36 / .12); color: var(--amber); }
  .item .lead .plogo { width: 28px; height: 28px; border-radius: 7px; font-size: 12px; }
  .item .body { flex: 1; min-width: 0; }
  .item .ttl { font-size: 13.5px; font-weight: 500; color: rgb(var(--c) / .92); line-height: 18px; }
  .item .sub { font-size: 12px; color: rgb(var(--c) / .45); line-height: 17px; margin-top: 2px; display: flex; gap: 6px; align-items: center; min-width: 0; }
  .item .sub > span { white-space: nowrap; }
  .item .sub .trunc { flex: 0 1 auto; }
  .item .end { display: flex; align-items: center; gap: 10px; flex: none; }
  .kind { font-size: 11px; color: rgb(var(--c) / .55); white-space: nowrap; }
  .age { font-size: 12px; color: rgb(var(--c) / .45); white-space: nowrap; font-variant-numeric: tabular-nums; min-width: 26px; text-align: right; }
  .age.old { color: var(--amber); font-weight: 500; }
  .idle-tag { font-size: 11px; color: rgb(var(--c) / .4); white-space: nowrap; }
  .empty { padding: 18px; font-size: 13px; color: rgb(var(--c) / .45); }

  /* phase cards */
  .phases { display: flex; flex-direction: column; gap: 10px; }
  .phase { border-radius: 12px; background: rgb(var(--c) / .04); }
  .flash { animation: flash 1300ms var(--ease); }
  @keyframes flash { 0%, 35% { box-shadow: 0 0 0 1px rgb(var(--c) / .35); } 100% { box-shadow: 0 0 0 1px transparent; } }
  .ph-head { display: flex; align-items: center; gap: 12px; padding: 14px 16px; }
  .ph-head .tog, .mrow-h .tog { display: flex; align-items: center; gap: 12px; flex: 1; min-width: 0; }
  .ph-id { font: 11px var(--mono); color: rgb(var(--c) / .45); flex: none; }
  .ph-name { font-size: 15px; font-weight: 600; letter-spacing: -.01em; }
  .ph-titles { min-width: 0; display: flex; flex-direction: column; }
  .chev { color: rgb(var(--c) / .4); transition: transform 200ms var(--ease); }
  .phase.open .ph-head .chev { transform: rotate(90deg); }
  .ph-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 220ms var(--ease); }
  .phase.open .ph-body { grid-template-rows: 1fr; }
  .ph-inner { min-height: 0; overflow: hidden; }
  .ph-content { padding: 0 16px 16px 48px; display: flex; flex-direction: column; gap: 16px; }
  .what { margin: 0; font-size: 13px; line-height: 1.5; color: rgb(var(--c) / .6); max-width: 62ch; }
  .note { display: flex; gap: 10px; align-items: flex-start; border-radius: 8px; background: rgb(var(--c) / .04); padding: 10px 12px; }
  .note .q { font-size: 13px; line-height: 1.5; color: rgb(var(--c) / .85); }
  .note .m { font-size: 11px; color: rgb(var(--c) / .45); margin-top: 3px; }
  .cols { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 20px; }
  .lbl { font-size: 11px; font-weight: 500; color: rgb(var(--c) / .45); margin-bottom: 8px; }
  .checks { display: flex; flex-direction: column; gap: 7px; }
  .chk { display: flex; align-items: flex-start; gap: 8px; font-size: 12.5px; line-height: 16px; color: rgb(var(--c) / .82); }
  .chk .by { display: block; font-size: 11px; color: rgb(var(--c) / .38); }
  .chk.on .ct { color: rgb(var(--c) / .45); }
  .circ { width: 16px; height: 16px; border-radius: 50%; border: 1px solid rgb(var(--c) / .25); display: grid; place-items: center; flex: none; transition: background-color 200ms ease, border-color 200ms ease; }
  .circ.on { background: rgb(52 211 153 / .2); border-color: transparent; color: var(--emerald-2); }
  .circ.on::after { content: ""; width: 6px; height: 3px; border: solid currentColor; border-width: 0 0 1.75px 1.75px; transform: translateY(-1px) rotate(-45deg); }
  .chats { display: flex; flex-direction: column; gap: 2px; }
  .chat-row { display: flex; align-items: center; gap: 8px; padding: 5px 8px; margin: 0 -8px; border-radius: 6px; font-size: 12.5px; color: rgb(var(--c) / .85); width: calc(100% + 16px); }
  .chat-row:hover { background: rgb(var(--c) / .06); }
  .chat-row .t { flex: 1; }
  .suggest { display: flex; align-items: center; gap: 12px; border-radius: 8px; background: rgb(52 211 153 / .08); padding: 10px 12px; animation: rise 260ms var(--ease); }
  .suggest .s { flex: 1; min-width: 0; font-size: 13px; color: var(--emerald-2); }
  .suggest .s small { display: block; font-size: 11px; color: rgb(var(--c) / .45); margin-top: 1px; }
  @keyframes rise { from { opacity: 0; transform: translateY(4px); } }

  /* status pill */
  .status { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; background: rgb(var(--c) / .06); font-size: 12px; white-space: nowrap; flex: none; transition: background-color 150ms ease; }
  .status:hover { background: rgb(var(--c) / .12); }
  .status .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .st-todo { color: rgb(var(--c) / .55); }
  .st-progress { color: var(--accent); }
  .st-built { color: var(--violet); }
  .st-blocked { color: var(--red); }
  .st-done { color: var(--emerald); }
  .needs-pill { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 600; color: var(--amber); background: rgb(251 191 36 / .12); border-radius: 999px; padding: 2px 8px; white-space: nowrap; flex: none; }
  .live { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; color: var(--accent); white-space: nowrap; flex: none; }

  /* glyph */
  .glyph { width: 20px; height: 20px; border-radius: 50%; border: 1.5px solid rgb(var(--c) / .25); display: grid; place-items: center; flex: none; }
  .g-done { background: rgb(52 211 153 / .2); border-color: transparent; color: var(--emerald-2); }
  .g-done::after { content: ""; width: 7px; height: 4px; border: solid currentColor; border-width: 0 0 2px 2px; transform: translateY(-1px) rotate(-45deg); }
  .g-built { border-color: var(--violet); background: linear-gradient(90deg, var(--violet) 50%, transparent 50%); }
  .g-progress { border-color: var(--accent); }
  .g-progress::after { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
  .g-blocked { border-color: var(--red); }
  .g-blocked::after { content: ""; width: 8px; height: 2px; background: var(--red); border-radius: 1px; }
  .glyph.sm { width: 14px; height: 14px; border-width: 1.25px; }
  .glyph.sm::after { transform: scale(.7); }
  .glyph.sm.g-done::after { transform: translateY(-1px) rotate(-45deg) scale(.75); }

  /* compact rows for upcoming / done phases */
  .mini { display: flex; flex-direction: column; padding: 6px; gap: 2px; }
  .mrow { border-radius: 8px; }
  .mrow-h { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 8px; }
  .mrow-h:hover { background: rgb(var(--c) / .05); }
  .mrow-h .nm { font-size: 13px; color: rgb(var(--c) / .85); }
  .mrow.done .nm { color: rgb(var(--c) / .55); }
  .mrow-d { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 200ms var(--ease); }
  .mrow.open .mrow-d { grid-template-rows: 1fr; }
  .mrow-d > div { min-height: 0; overflow: hidden; }
  .mrow-d .in { padding: 2px 10px 12px 46px; display: flex; flex-direction: column; gap: 10px; }
  .done-line { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-radius: 12px; width: 100%; background: rgb(var(--c) / .04); font-size: 13px; color: rgb(var(--c) / .6); }
  .done-line:hover { background: rgb(var(--c) / .06); }
  .done-line .trunc { flex: 1; }
  .hide-done { width: 100%; padding: 8px 10px; border-radius: 8px; font-size: 12px; color: rgb(var(--c) / .5); }
  .hide-done:hover { background: rgb(var(--c) / .05); color: rgb(var(--c)); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { height: 30px; display: inline-flex; align-items: center; gap: 8px; border-radius: 8px; background: rgb(var(--c) / .05); border: 1px solid rgb(var(--c) / .08); padding: 0 10px 0 8px; font-size: 12.5px; color: rgb(var(--c) / .85); white-space: nowrap; transition: background-color 150ms ease; }
  .chip:hover { background: rgb(var(--c) / .09); }

  .draft { display: flex; align-items: center; gap: 16px; }
  .draft .txt { flex: 1; min-width: 0; }
  .draft .t { font-size: 14px; font-weight: 600; }
  .draft .d { font-size: 13px; color: rgb(var(--c) / .55); margin-top: 3px; line-height: 1.5; }

  /* ---------- chat ---------- */
  .chat { display: flex; flex-direction: column; height: 100%; }
  .pane-h { height: 36px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 12px; border-bottom: 1px solid var(--stroke); flex: none; min-width: 0; }
  .strip { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 8px; border-radius: 6px; font-size: 12px; color: rgb(var(--c) / .55); min-width: 0; max-width: 100%; transition: background-color 150ms ease, color 150ms ease; }
  .strip:hover, .strip[aria-expanded="true"] { background: rgb(var(--c) / .08); color: rgb(var(--c)); }
  .strip b { font-weight: 500; color: rgb(var(--c) / .9); }
  .transcript { flex: 1; overflow: auto; }
  .tx { max-width: 720px; margin: 0 auto; padding: 24px 24px 32px; display: flex; flex-direction: column; gap: 18px; font-size: 14px; line-height: 1.6; }
  .tx .u { align-self: flex-end; background: rgb(var(--c) / .07); border: 1px solid rgb(var(--c) / .06); padding: 10px 14px; border-radius: 12px; max-width: 80%; }
  .tx .a { color: rgb(var(--c) / .9); }
  .tx .a p { margin: 0; }

let S = seed();

const $$ = (s, r = document) => [...r.querySelectorAll(s)];

const sess = (id) => S.sessions.find((s) => s.id === id);
const phase = (id) => S.phases.find((p) => p.id === id);
const icon = (id, cls = "i") => `<svg class="${cls}"><use href="#${id}"/></svg>`;
const esc = (t) => String(t).replace(/[&<>"']/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[ch]);
const logo = (p) => `<span class="plogo" style="background:${p.color}">${p.letter}</span>`;
const NEW = '<span class="new">New</span>';

function provIcon(s)
{
  if (s.prov === "claude") {
    return '<span class="prov claude">✳</span>';
  }
  if (s.prov === "codex") {
    return `<span class="prov codex">${icon("codex", "i i14")}</span>`;
  }
  return '<span class="prov grok" style="font-weight:700;font-size:12px">𝕏</span>';
}

function label(s)
{
  if (s.state === "waiting") {
    return `<span class="lab waiting">${icon("alert", "i i12")}Needs you</span>`;
  }
  if (s.state === "working") {
    return '<span class="lab working"><span class="spin">⠋</span>Working...</span>';
  }
  if (s.state === "done") {
    return `<span class="lab done">${icon("check", "i i12")}Done</span>`;
  }
  return `<span class="lab tab-num">${s.tm}</span>`;
}

function waitsFor(project)
{
  return S.waits.filter((w) => w.project === project).sort((a, b) => b.mins - a.mins);
}

function countsHtml(pid)
{
  const ss = S.sessions.filter((s) => s.project === pid);
  const working = ss.filter((s) => s.state === "working").length;
  const waiting = S.waits.filter((w) => w.project === pid).length;
  const done = ss.filter((s) => s.state === "done").length;
  return `<span class="counts tab-num">${working ? `<span class="w" title="${working} working">${working}</span>` : ""}${waiting ? `<span class="n" title="${waiting} need you">${icon("alert", "i i12")}${waiting}</span>` : ""}${done ? `<span class="d" title="${done} done">${icon("check", "i i12")}${done}</span>` : ""}</span>`;
}

function yapNow()
{
  return S.phases.find((x) => x.status === "progress") || S.phases.find((x) => x.status !== "done");
}

function projActivity(p)
{
  if (p.id === "yap") {
    const now = yapNow();
    return now ? `Phase ${now.id} · ${now.name}` : "All phases done";
  }
  return p.phaseLabel || "No plan";
}

/* ---------- sidebar ---------- */

{

  const p = proj(cur || "yap");
  const list = S.sessions.filter((s) => s.project === p.id);
  $("#scard").innerHTML = `<div class="scard-h">${logo(p)}<span class="nm trunc">${p.name}</span><button class="ibtn" aria-label="New session">${icon("plus", "i i14")}</button></div>
    <div class="slist">
      <button class="srow home ${v.kind === "home" && v.project === p.id ? "on" : ""}" data-home="${p.id}"><span class="prov" style="color:rgb(var(--c) / .7)">${icon("home", "i i14")}</span><span class="t trunc">Project home</span>${NEW}</button>
      ${list.map((s) => `<button class="srow ${v.kind === "chat" && v.session === s.id ? "on" : ""}" data-chat="${s.id}">${provIcon(s)}<span class="t trunc">${s.title}</span>${label(s)}</button>`).join("")}
    </div>`;
}

function renderTabs()
{
  const v = S.view;
  const tabs = [`<button class="tab mob" data-nav="all" aria-label="All projects">${icon("grid", "i i14")}</button>`];
  if (v.kind === "all") {
    tabs.push(`<button class="tab pin on">${icon("grid", "i i14")}<span class="t">All projects</span></button>`);
  } else {
    const p = proj(v.project);
    tabs.push(`<button class="tab pin ${v.kind === "home" ? "on" : ""}" data-home="${p.id}">${icon("home", "i i14")}<span class="t">${p.name}</span></button>`);
    const open = S.sessions.filter((s) => s.project === p.id && s.state !== "done").slice(0, 3);
    if (v.kind === "chat" && !open.some((s) => s.id === v.session)) {
      open.push(sess(v.session));
    }
    open.forEach((s) => {
      tabs.push(`<button class="tab ${v.kind === "chat" && v.session === s.id ? "on" : ""}" data-chat="${s.id}">${provIcon(s)}<span class="t">${s.title}</span></button>`);
    });
  }
  $("#tabs").innerHTML = tabs.join("") + `<button class="tab-add" aria-label="New tab">${icon("plus", "i i14")}</button>`;
}

/* ---------- shared pieces ---------- */

function waitItem(w, showProject)
{
  const p = proj(w.project);
  const s = sess(w.session);
  const ended = s.state === "idle" || s.state === "done";
  const where = [showProject ? p.name : null, w.phase ? `Phase ${w.phase}` : null, s.title].filter(Boolean);
  return `<button class="item wait" data-wait="${w.id}">
    <span class="lead ${showProject ? "" : "amber"}">${showProject ? logo(p) : icon(w.kind === "Your step" ? "hand" : "alert")}</span>
    <span class="body"><span class="ttl trunc" style="display:block">${w.text}</span>
      <span class="sub"><span class="trunc">${where.join(" · ")}</span>${ended ? '<span class="idle-tag" data-tip="This chat is not running. Replying wakes it.">· chat idle</span>' : ""}</span></span>
    <span class="end"><span class="kind">${w.kind}</span><span class="age ${w.mins >= 1440 ? "old" : ""}">${w.age}</span><span class="btn ghost sm open-btn">Open</span></span>
  </button>`;
}

function needsSection(list, showProject, emptyText)
{
  return `<section><div class="sec-h"><h2>Needs you</h2><span class="count ${list.length ? "amber" : ""}">${list.length}</span><span class="sp"></span><span class="meta">oldest first</span></div>
    <div class="card">${list.length ? `<div class="list">${list.map((w) => waitItem(w, showProject)).join("")}</div>` : `<div class="empty">${emptyText}</div>`}</div></section>`;
}

function handoffCard(p)
{
  return `<section class="card pad handoff"><div class="k"><span>Latest handoff</span><span class="sp"></span><span data-tip="From .claude/handoff.md">${p.handoff.by} · ${p.handoff.age} ago</span></div><p>${p.handoff.text}</p></section>`;
}

/* ---------- all projects ---------- */

function renderAll()
{
  const waits = [...S.waits].sort((a, b) => b.mins - a.mins);
  const working = S.sessions.filter((s) => s.state === "working").length;
  const total = S.projects.reduce((a, p) => a + p.spend, 0);
  $("#v-all").innerHTML = `<div class="page">
    <header class="head"><div class="txt"><h1>All projects ${NEW}</h1><div class="now">What needs you across ${S.projects.length} projects</div></div></header>
    <div class="stats">
      <div class="stat amber"><div class="k">Needs you</div><div class="v">${waits.length}</div></div>
      <div class="stat"><div class="k">Chats working</div><div class="v">${working}</div></div>
      <div class="stat"><div class="k">Spent today</div><div class="v">$${total.toFixed(2)}</div></div>
    </div>
    ${needsSection(waits, true, "Nothing needs you. The chats are on it.")}
    <section><div class="sec-h"><h2>Projects</h2><span class="count">${S.projects.length}</span></div>
      <div class="card"><div class="list">${S.projects.map(projItem).join("")}</div></div></section>
  </div>`;
}

function projItem(p)
{
  let ph = "No plan yet";
  if (p.id === "yap") {
    const now = yapNow();
    const done = S.phases.filter((x) => x.status === "done").length;
    ph = now ? `Phase ${now.id} · ${now.name} · ${done} of ${S.phases.length} done` : "All phases done";
  } else if (p.phaseLabel) {
    ph = `${p.phaseLabel} · ${p.done} of ${p.total} done`;
  }
  return `<button class="item proj-item" data-home="${p.id}"><span class="lead">${logo(p)}</span>
    <span class="body"><span class="ttl" style="display:flex;gap:8px;align-items:baseline;min-width:0"><span class="nowrap">${p.name}</span><span class="trunc" style="font-size:12px;font-weight:400;color:rgb(var(--c) / .5)">${ph}</span></span>
      <span class="sub"><span class="trunc">${p.handoff.text}</span></span></span>
    <span class="end">${countsHtml(p.id)}<span class="age" style="${p.hot ? "color:var(--amber)" : ""}" data-tip="${p.hot ? "Spending faster than usual today" : "Spent today"}">$${p.spend.toFixed(2)}</span></span></button>`;
}

/* ---------- project home ---------- */

function isActive(p)
{
  const asks = S.waits.some((w) => w.project === "yap" && w.phase === p.id);
  if (p.status === "done") {
    return asks;
  }
  const live = S.sessions.some((s) => s.project === "yap" && s.phase === p.id && (s.state === "working" || s.state === "waiting"));
  return live || asks || p.status === "progress" || p.status === "built" || p.status === "blocked";
}

function renderHome()
{
  const p = proj(S.view.project);
  if (!p.plan) {
    renderNoPlan(p);
    return;
  }
  if (p.id !== "yap") {
    $("#v-home").innerHTML = `<div class="page"><header class="head">${logo(p)}<div class="txt"><h1>${p.name}</h1><div class="now">Now: <b>${p.phaseLabel}</b> · ${p.done} of ${p.total} phases done</div></div></header>
      ${handoffCard(p)}${needsSection(waitsFor(p.id), false, "Nothing needs you here.")}<div class="empty">This mockup only fills in Yap's roadmap.</div></div>`;
    return;
  }
  const active = S.phases.filter(isActive);
  const next = S.phases.filter((x) => x.status !== "done" && !isActive(x));
  const done = S.phases.filter((x) => x.status === "done" && !isActive(x));
  const now = yapNow();
  const waits = waitsFor("yap");
  const working = S.sessions.filter((s) => s.project === "yap" && s.state === "working").length;
  const loose = S.sessions.filter((s) => s.project === "yap" && !s.phase);
  const doneCount = S.phases.filter((x) => x.status === "done").length;
  $("#v-home").innerHTML = `<div class="page">
    <header class="head">${logo(p)}<div class="txt"><h1>${p.name}</h1><div class="now">${now ? `Now: <b>Phase ${now.id} · ${now.name}</b>` : "<b>All phases done</b>"}</div></div>
      <div class="btns"><button class="btn ghost" data-toast="Opens docs/plan.md in the file viewer">${icon("file", "i i14")}<span class="lbl-txt">plan.md</span></button><button class="btn solid" data-toast="Opens a new chat in Yap">${icon("plus", "i i14")}<span class="lbl-txt">New chat</span></button></div></header>
    <div class="stats">
      <div class="stat"><div class="k">Phases done</div><div class="v">${doneCount}<small>of ${S.phases.length}</small></div></div>
      <div class="stat ${waits.length ? "amber" : ""}"><div class="k">Needs you</div><div class="v">${waits.length}</div></div>
      <div class="stat"><div class="k">Chats working</div><div class="v">${working}</div></div>
      <div class="stat"><div class="k">Spent today</div><div class="v">$${p.spend.toFixed(2)}</div></div>
    </div>
    ${handoffCard(p)}
    ${needsSection(waits, false, "Nothing needs you on Yap.")}
    <section><div class="sec-h"><h2>Roadmap</h2><span class="sp"></span><span class="meta">from docs/plan.md</span></div>
      ${active.length ? `<div class="sub-h">Active <span class="tab-num">${active.length}</span></div><div class="phases">${active.map(phaseCard).join("")}</div>` : ""}
      ${next.length ? `<div class="sub-h">Up next <span class="tab-num">${next.length}</span></div><div class="card mini">${next.map(miniRow).join("")}</div>` : ""}
      ${done.length ? `<div class="sub-h">Done <span class="tab-num">${done.length}</span></div>${S.doneOpen
        ? `<div class="card mini">${done.map(miniRow).join("")}<button class="hide-done" data-donetoggle="1">Hide done phases</button></div>`
        : `<button class="done-line" data-donetoggle="1"><span class="glyph sm g-done"></span><span class="trunc">${done.map((x) => x.name).join(", ")}</span>${icon("chev", "i i14 chev")}</button>`}` : ""}
    </section>
    ${loose.length ? `<section><div class="sec-h"><h2>Chats not on a phase</h2><span class="count">${loose.length}</span><span class="sp"></span><span class="meta">click one to put it on a phase</span></div>
      <div class="chips">${loose.map((s) => `<button class="chip" data-linkmenu="${s.id}" data-tip="${s.last}">${provIcon(s)}${s.title}${label(s)}</button>`).join("")}</div></section>` : ""}
  </div>`;
}

function statusBtn(p)
{
  return `<button class="status st-${p.status}" data-statusmenu="${p.id}" aria-expanded="false" data-tip="${p.set ? "Set by " + p.set + ". Click to change." : "Click to set the status"}"><span class="dot"></span>${STATUS[p.status]}${icon("down", "i i12")}</button>`;
}

function phaseCard(p)
{
  const open = p.id in S.open ? S.open[p.id] : true;
  const chats = S.sessions.filter((s) => s.project === "yap" && s.phase === p.id);
  const working = chats.filter((s) => s.state === "working").length;
  const asks = S.waits.filter((w) => w.project === "yap" && w.phase === p.id);
  const newest = chats.find((s) => s.state === "working") || chats.find((s) => s.state === "waiting") || chats[0];
  const met = p.checks.filter((c) => c[1]).length;
  const sug = S.suggest[p.id] || (met === p.checks.length && p.status !== "done" ? "checks" : null);
  return `<div class="phase ${open ? "open" : ""}" data-phase="${p.id}">
    <div class="ph-head">
      <button class="tog" data-toggle="${p.id}" aria-expanded="${open}"><span class="glyph g-${p.status}"></span>
        <span class="ph-titles"><span class="ph-id">PHASE ${p.id}</span><span class="ph-name trunc">${p.name}</span></span></button>
      ${asks.length ? `<span class="needs-pill">${icon("alert", "i i12")}Needs you</span>` : ""}
      ${working ? `<span class="live"><span class="spin">⠋</span>${working} working</span>` : ""}
      ${statusBtn(p)}
      <button class="ibtn" data-toggle="${p.id}" aria-label="${open ? "Collapse" : "Expand"}">${icon("chev", "i i14 chev")}</button>
    </div>
    <div class="ph-body" ${open ? "" : "inert"}><div class="ph-inner"><div class="ph-content">
      <p class="what">${p.what}</p>
      ${newest ? `<div class="note">${provIcon(newest)}<div><div class="q">${newest.last}</div><div class="m">${newest.title} · ${newest.tm === "now" ? "just now" : newest.tm + " ago"}</div></div></div>` : ""}
      ${sug && p.status !== "done" ? `<div class="suggest"><div class="s">Looks done<small>${sug === "merged" ? "The branch merged into main" : "Every done-when is met"}. Nothing changes until you mark it.</small></div><button class="btn ghost sm green" data-setstatus="${p.id}:done">Mark done</button></div>` : ""}
      <div class="cols">
        <div><div class="lbl">Done when · ${met} of ${p.checks.length}</div><div class="checks">${p.checks.map((c) =>
          `<div class="chk ${c[1] ? "on" : ""}"><span class="circ ${c[1] ? "on" : ""}"></span><span><span class="ct">${c[0]}</span>${c[1] && c[2] ? `<span class="by">ticked by ${c[2]}</span>` : ""}</span></div>`).join("")}</div></div>
        <div><div class="lbl">Chats · ${chats.length}</div><div class="chats">${chats.map((s) =>
          `<button class="chat-row" data-chat="${s.id}" data-tip="${s.last}">${provIcon(s)}<span class="t trunc">${s.title}</span>${label(s)}</button>`).join("")}</div>
          <div style="margin-top:8px"><button class="btn ghost sm" data-start="${p.id}">${icon("plus", "i i14")}New chat</button></div></div>
      </div>
    </div></div></div>
  </div>`;
}

function miniRow(p)
{
  const open = !!S.open["m" + p.id];
  return `<div class="mrow ${p.status === "done" ? "done" : ""} ${open ? "open" : ""}" data-phase="${p.id}">
    <div class="mrow-h"><button class="tog" data-mtoggle="${p.id}" aria-expanded="${open}"><span class="glyph sm g-${p.status}"></span><span class="ph-id" style="width:22px">${p.id}</span><span class="nm trunc">${p.name}</span></button>
      ${p.status === "done" ? statusBtn(p) : `<button class="btn ghost sm" data-start="${p.id}">Start</button>`}</div>
    <div class="mrow-d" ${open ? "" : "inert"}><div><div class="in"><p class="what">${p.what}</p>
      <div class="checks">${p.checks.map((c) => `<div class="chk ${c[1] ? "on" : ""}"><span class="circ ${c[1] ? "on" : ""}"></span><span class="ct">${c[0]}</span></div>`).join("")}</div></div></div></div>
  </div>`;
}

function renderNoPlan(p)
{
  const chats = S.sessions.filter((s) => s.project === p.id);
  $("#v-home").innerHTML = `<div class="page">
    <header class="head">${logo(p)}<div class="txt"><h1>${p.name}</h1><div class="now">No plan yet · ${chats.length} chats</div></div>
      <div class="btns"><button class="btn ghost" data-toast="Opens a new chat in ${p.name}">${icon("plus", "i i14")}<span class="lbl-txt">New chat</span></button></div></header>
    ${handoffCard(p)}
    ${needsSection(waitsFor(p.id), false, "Nothing needs you here.")}
    <section class="card pad draft"><div class="txt"><div class="t">No roadmap yet</div><div class="d">A chat can read the handoff and these ${chats.length} chats, then show you a phase table to approve. It's saved as docs/plan.md.</div></div>
      <button class="btn solid" data-draft="${p.id}">${icon("spark", "i i14")}Draft a plan</button></section>
    <section><div class="sec-h"><h2>Chats</h2><span class="count">${chats.length}</span></div>
      <div class="card"><div class="list">${chats.map((s) => `<button class="item" data-chat="${s.id}"><span class="lead">${provIcon(s)}</span><span class="body"><span class="ttl trunc" style="display:block">${s.title}</span><span class="sub"><span class="trunc">${s.last}</span></span></span><span class="end">${label(s)}</span></button>`).join("")}</div></div></section>
  </div>`;
}

/* ---------- chat ---------- */

function renderChat(focusWait)
{
  const s = sess(S.view.session);
  const p = proj(s.project);
  const ph = s.phase && s.project === "yap" ? phase(s.phase) : null;
  const asks = S.waits.filter((w) => w.session === s.id);
  const strip = ph
    ? `<span class="glyph sm g-${ph.status}"></span><span class="trunc">${p.name} › <b>Phase ${ph.id} · ${ph.name}</b></span>`
    : `<span class="trunc">${p.name} › <b>${p.plan ? "Not on a phase" : "No plan yet"}</b></span>`;
  const model = s.prov === "claude" ? "Opus 5.5" : s.prov === "codex" ? "GPT-6.1 Sol" : "Grok 4.7";
  $("#v-chat").innerHTML = `<div class="chat">
    <div class="pane-h"><button class="strip" id="strip" aria-expanded="false">${strip}${asks.length ? '<span class="needs-pill">Needs you</span>' : ""}${icon("down", "i i12")}</button>${NEW}<span style="flex:1"></span><button class="ibtn" aria-label="Close">${icon("x", "i i14")}</button></div>
    <div class="transcript"><div class="tx">
      <div class="u">${s.id === "s1" ? "Build Phase 1 from plan.md." : "Carry on with " + (ph ? "Phase " + ph.id : "this") + "."}</div>
      <div class="worked">${icon("check", "i i14")}Worked for 14m 32s</div>
      <div class="a"><p>${s.last}</p></div>
      ${asks.map((w) => w.kind === "Your step"
        ? `<div class="ask ${focusWait === w.id ? "hl" : ""}" id="ask-${w.id}"><button class="circ" data-tickwait="${w.id}" aria-label="Mark done"></button><div><div class="t">${w.text}</div><div class="w">On your checklist · tick it when done</div></div></div>`
        : `<div class="ask ${focusWait === w.id ? "hl" : ""}" id="ask-${w.id}"><span style="color:var(--amber);margin-top:2px">${icon("alert", "i")}</span><div style="flex:1;min-width:0"><div class="t">${w.text}</div><div class="w">Waiting ${w.age} · reply below or pick one</div>
            <div class="acts"><button class="btn solid sm" data-answer="${w.id}:Yes">Yes</button><button class="btn ghost sm" data-answer="${w.id}:Not yet">Not yet</button></div></div></div>`).join("")}
    </div></div>
    <div class="composer-wrap"><div class="composer">
      <div class="cpath">${icon("folder", "i i12")}<span class="trunc">${p.path}</span><span style="display:inline-flex;gap:4px;align-items:center;flex:none">${icon("branch", "i i12")}main</span></div>
      <textarea id="ta" placeholder="Ask, build, / for skills..."></textarea>
      <div class="ctool"><button class="cbtn sq" aria-label="Attach">${icon("plus", "i i14")}</button><button class="cbtn">${provIcon(s)}${model}${icon("down", "i i12")}</button>
        <button class="cbtn">${icon("gauge", "i i14")}High${icon("down", "i i12")}</button><button class="cbtn">${icon("lock", "i i14")}Supervised</button>
        <button class="send" id="send" aria-label="Send">${icon("arrow", "i i14")}</button></div>
    </div></div>
  </div>`;
  if (focusWait) {
    const el = $("#ask-" + focusWait);
    if (el) {
      el.scrollIntoView({ block: "center" });
    }
    $("#ta").focus();
  }
}

/* ---------- render + nav ---------- */

function render(opts = {})
{
  const v = S.view;
  clearTimeout(tipTimer);
  $("#tip").classList.remove("show");
  $("#v-all").hidden = v.kind !== "all";
  $("#v-home").hidden = v.kind !== "home";
  $("#v-chat").hidden = v.kind !== "chat";
  renderSide();
  renderTabs();
  if (v.kind === "all") {
    renderAll();
  } else if (v.kind === "home") {
    renderHome();
  } else {
    renderChat(opts.focusWait);
  }
  tick();
}

function nav(view, opts)
{
  closePop();
  S.view = view;
  render(opts);
  if (!opts || !opts.keepScroll) {
    $$(".view").forEach((v) => (v.scrollTop = 0));
  }
}

function tick()
{
  const f = FRAMES[frame % FRAMES.length];
  $$(".spin").forEach((el) => (el.textContent = f));
}

if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
  setInterval(() => {
    frame++;
    tick();
  }, 80);
}

function toast(msg, meta, withUndo)
{
  const el = document.createElement("div");
  el.className = "toast";
  el.innerHTML = `<div class="grow">${msg}${meta ? `<span class="m">${meta}</span>` : ""}</div>${withUndo ? "<button>Undo</button>" : ""}`;
  $("#toasts").prepend(el);
  const kill = () => {
    el.classList.add("out");
    setTimeout(() => el.remove(), 170);
  };
  if (withUndo) {
    const back = undoSnap;
    const g = gen;
    $("button", el).onclick = () => {
      if (g !== gen) {
        kill();
        return;
      }
      gen++;
      S = back;
      render({ keepScroll: true });
      kill();
    };
  }
  setTimeout(kill, 5000);
}

function act(msg, meta, fn)
{
  undoSnap = snap();
  fn();
  render({ keepScroll: true });
  toast(msg, meta, true);
}

/* ---------- popovers ---------- */

function showPop(html, anchor, align)
{
  closePop();
  const el = $("#pop");
  el.innerHTML = html;
  el.inert = false;
  el.classList.add("show");
  const r = anchor.getBoundingClientRect();
  const w = el.offsetWidth;
  const h = el.offsetHeight;
  const left = align === "right" ? r.right - w : r.left;
  el.style.left = Math.max(8, Math.min(left, innerWidth - w - 8)) + "px";
  const below = r.bottom + 4 + h <= innerHeight - 8;
  el.style.top = (below ? r.bottom + 4 : Math.max(8, r.top - 4 - h)) + "px";
  el.style.setProperty("--o", (below ? "top " : "bottom ") + (align === "right" ? "right" : "left"));
  pop = anchor;
  anchor.setAttribute("aria-expanded", "true");
  const first = $(".mi", el);
  if (first) {
    first.focus({ preventScroll: true });
  }
}

function closePop()
{
  if (!pop) {
    return;
  }
  $("#pop").classList.remove("show");
  $("#pop").inert = true;
  pop.setAttribute("aria-expanded", "false");
  pop = null;
}

function statusMenu(id, anchor)
{
  const p = phase(id);
  showPop(`<div class="ml">Phase ${p.id} status</div>` + Object.keys(STATUS).map((k) =>
    `<button class="mi ${p.status === k ? "cur" : ""}" data-setstatus="${id}:${k}"><span class="glyph sm g-${k}"></span>${STATUS[k]}${p.status === k ? '<span class="r">now</span>' : ""}</button>`).join("")
    + `<div class="note2">Saved to the Status column in plan.md, so every agent sees it.${p.set ? " Last set by " + p.set + "." : ""}</div>`, anchor, "right");
}

function linkMenu(sid, anchor)
{
  showPop(`<div class="ml">Put on a phase</div>` + S.phases.filter((p) => p.status !== "done").map((p) =>
    `<button class="mi" data-link="${sid}:${p.id}"><span class="glyph sm g-${p.status}"></span>${p.id} · ${p.name}</button>`).join("")
    + `<button class="mi" data-chat="${sid}">Open the chat<span class="r">↵</span></button>`, anchor, "left");
}

function roadPop(anchor)
{
  const s = sess(S.view.session);
  const p = proj(s.project);
  if (p.id !== "yap") {
    showPop(`<div class="ml">${p.name}</div><button class="mi" data-home="${p.id}">${icon("home", "i i14")}Open project home</button>`, anchor);
    return;
  }
  const done = S.phases.filter((x) => x.status === "done").length;
  showPop(`<div class="ml">Yap roadmap · ${done} of ${S.phases.length} done</div>` + S.phases.map((x) =>
    `<button class="mi ${x.id === s.phase ? "cur" : ""}" data-gophase="${x.id}"><span class="glyph sm g-${x.status}"></span>${x.id} · ${x.name}${S.waits.some((w) => w.project === "yap" && w.phase === x.id) ? '<span class="r" style="color:var(--amber)">needs you</span>' : `<span class="r">${STATUS[x.status]}</span>`}</button>`).join("")
    + `<button class="mi" data-home="yap">${icon("home", "i i14")}Open Yap home</button>`, anchor);
}

function demoMenu(anchor)
{
  showPop(`<div class="ml">Pretend that…</div>
    <button class="mi" data-sim="approve">Daily reminder asks for approval</button>
    <button class="mi" data-sim="finish">The search chat finishes</button>
    <button class="mi" data-sim="merge">Phase 2's branch merges</button>
    <button class="mi" data-sim="reset">Reset the demo</button>
    <div class="note2"><span class="new">New</span> marks what this adds. Everything else is MonoCode as it is today.</div>`, anchor);
}

/* ---------- actions ---------- */

function setStatus(id, k)
{
  const p = phase(id);
  closePop();
  if (p.status === k) {
    return;
  }
  act(`Phase ${id} is now “${STATUS[k]}”`, "Saved to docs/plan.md · set by Sam", () => {
    p.status = k;
    p.set = "Sam · just now";
    delete S.suggest[id];
    if (k === "done") {
      p.checks.forEach((c) => {
        if (!c[1]) {
          c[1] = 1;
          c[2] = "Sam";
        }
      });
      S.waits.filter((w) => w.project === "yap" && w.phase === id).forEach((w) => {
        const ws = sess(w.session);
        if (ws.state === "waiting") {
          ws.state = "idle";
        }
      });
      S.waits = S.waits.filter((w) => !(w.project === "yap" && w.phase === id));
    }
  });
}

function startPhase(id, btn)
{
  if (starting.has(id)) {
    return;
  }
  starting.add(id);
  btn.disabled = true;
  btn.textContent = "Starting…";
  const g = gen;
  setTimeout(() => {
    starting.delete(id);
    if (g !== gen) {
      return;
    }
    const p = phase(id);
    undoSnap = snap();
    S.sessions.push({ id: "n" + Date.now(), project: "yap", phase: id, prov: "claude", title: p.name, state: "working", tm: "now", last: `Reading the Phase ${id} brief and done-when from plan.md…` });
    if (p.status === "todo") {
      p.status = "progress";
      p.set = "Started by Sam · just now";
    }
    S.open[id] = true;
    render({ keepScroll: true });
    const card = $(`.phase[data-phase="${id}"]`);
    if (card) {
      card.scrollIntoView({ block: "nearest" });
      card.classList.add("flash");
    }
    toast(`New chat for Phase ${id}`, "Started with the phase brief and done-when", true);
  }, 600);
}

function resolveWait(wid, how)
{
  const w = S.waits.find((x) => x.id === wid);
  if (!w) {
    return;
  }
  undoSnap = snap();
  const s = sess(w.session);
  S.waits = S.waits.filter((x) => x.id !== wid);
  s.state = "working";
  s.tm = "now";
  if (wid === "w1" && !how) {
    s.last = "Thanks for journalling on it. Running the kill test before the merge.";
  } else {
    s.last = how ? `On it: “${esc(how)}”` : "On it.";
  }
  render({ keepScroll: true });
  toast(how ? "Reply sent" : "Ticked off", `${s.title} is working again`, true);
}

function simulate(kind)
{
  closePop();
  if (kind === "approve") {
    const s = sess("s4");
    if (s.state === "waiting") {
      return;
    }
    act("Daily reminder needs you", "Run the reminder migration?", () => {
      s.state = "waiting";
      s.tm = "now";
      s.last = "Needs approval: run the database migration for reminders?";
      S.waits.push({ id: "w" + Date.now(), project: "yap", phase: "3", session: "s4", kind: "Approval", text: "Run the reminder database migration", age: "now", mins: 0 });
    });
  } else if (kind === "finish") {
    act("Find it later: search finished", "Calendar and search done", () => {
      const s = sess("s3");
      s.state = "done";
      s.tm = "now";
      s.last = "Search done, tests pass. You can find any note by word or date.";
      phase("3").checks[0][1] = 1;
      phase("3").checks[0][2] = "Search chat";
    });
  } else if (kind === "merge") {
    act("Phase 2's branch merged into main", "Suggested as done; the status is unchanged", () => {
      S.suggest["2"] = "merged";
      S.open["2"] = true;
    });
  } else if (kind === "reset") {
    gen++;
    undoSnap = null;
    $("#toasts").innerHTML = "";
    S = seed();
    render();
  }
}

function sendReply()
{
  const ta = $("#ta");
  const text = ta.value.trim();
  if (!text) {
    ta.focus();
    return;
  }
  const s = sess(S.view.session);
  const w = S.waits.find((x) => x.session === s.id && x.kind !== "Your step");
  if (w) {
    resolveWait(w.id, text);
  } else {
    undoSnap = snap();
    s.state = "working";
    s.tm = "now";
    s.last = `On it: “${esc(text)}”`;
    render({ keepScroll: true });
    toast("Sent", s.title, true);
  }
  $("#ta").focus();
}

/* ---------- events ---------- */

document.addEventListener("click", (e) => {
  const t = e.target.closest("button") || e.target;
  const d = t.dataset || {};
  if (pop && !$("#pop").contains(e.target) && !pop.contains(e.target)) {
    closePop();
  }
  if (d.setstatus) {
    const [id, k] = d.setstatus.split(":");
    setStatus(id, k);
  } else if (d.statusmenu) {
    if (pop === t) {
      closePop();
    } else {
      statusMenu(d.statusmenu, t);
    }
  } else if (d.link) {
    const [sid, pid] = d.link.split(":");
    closePop();
    act(`Put on Phase ${pid}`, sess(sid).title, () => {
      sess(sid).phase = pid;
      S.open[pid] = true;
    });
  } else if (d.linkmenu) {
    linkMenu(d.linkmenu, t);
  } else if (d.wait) {
    const w = S.waits.find((x) => x.id === d.wait);
    nav({ kind: "chat", project: w.project, session: w.session }, { focusWait: w.id });
  } else if (d.tickwait) {
    t.classList.add("on");
    const g = gen;
    setTimeout(() => {
      if (g === gen) {
        resolveWait(d.tickwait);
      }
    }, 220);
  } else if (d.answer) {
    const [wid, how] = d.answer.split(":");
    resolveWait(wid, how);
  } else if (d.chat) {
    const s = sess(d.chat);
    nav({ kind: "chat", project: s.project, session: s.id });
  } else if (d.home) {
    nav({ kind: "home", project: d.home });
  } else if (d.nav === "all") {
    nav({ kind: "all" });
  } else if (d.toggle) {
    const row = $(`.phase[data-phase="${d.toggle}"]`);
    const now = !row.classList.contains("open");
    S.open[d.toggle] = now;
    row.classList.toggle("open", now);
    $(".ph-body", row).inert = !now;
    $(".tog", row).setAttribute("aria-expanded", now);
    $('[aria-label="Expand"], [aria-label="Collapse"]', row).setAttribute("aria-label", now ? "Collapse" : "Expand");
  } else if (d.mtoggle) {
    const row = t.closest(".mrow");
    const now = !row.classList.contains("open");
    S.open["m" + d.mtoggle] = now;
    row.classList.toggle("open", now);
    $(".mrow-d", row).inert = !now;
    t.setAttribute("aria-expanded", now);
  } else if (d.donetoggle) {
    S.doneOpen = !S.doneOpen;
    render({ keepScroll: true });
  } else if (d.start) {
    startPhase(d.start, t);
  } else if (d.gophase) {
    const p = phase(d.gophase);
    if (isActive(p)) {
      S.open[p.id] = true;
    } else {
      S.open["m" + p.id] = true;
      if (p.status === "done") {
        S.doneOpen = true;
      }
    }
    nav({ kind: "home", project: "yap" });
    const row = $(`.phase[data-phase="${p.id}"], .mrow[data-phase="${p.id}"]`);
    row.scrollIntoView({ block: "center" });
    row.classList.add("flash");
  } else if (d.draft) {
    toast("Drafting a plan…", "A chat reads the handoff and chat notes, then shows you a phase table to approve", false);
  } else if (d.toast) {
    toast(d.toast);
  } else if (d.sim) {
    simulate(d.sim);
  } else if (t.id === "demoBtn") {
    if (pop === t) {
      closePop();
    } else {
      demoMenu(t);
    }
  } else if (t.id === "strip") {
    if (pop === t) {
      closePop();
    } else {
      roadPop(t);
    }
  } else if (t.id === "send") {
    sendReply();
  }
});

document.addEventListener("keydown", (e) => {
  if (e.key === "Escape" && pop) {
    const a = pop;
    closePop();
    a.focus();
  } else if (e.key === "Enter" && !e.shiftKey && e.target.id === "ta") {
    e.preventDefault();
    sendReply();
  }
});

document.addEventListener("scroll", (e) => {
  if (pop && !$("#pop").contains(e.target)) {
    closePop();
  }
}, true);

document.addEventListener("mouseover", (e) => {
  const el = e.target.closest("[data-tip]");
  clearTimeout(tipTimer);
  const tip = $("#tip");
  if (!el) {
    tip.classList.remove("show");
    return;
  }
  tipTimer = setTimeout(() => {
    if (!el.isConnected) {
      return;
    }
    tip.textContent = el.dataset.tip;
    const r = el.getBoundingClientRect();
    tip.classList.add("show");
    tip.style.left = Math.max(8, Math.min(r.left, innerWidth - tip.offsetWidth - 8)) + "px";
    tip.style.top = r.bottom + 6 + "px";
  }, tip.classList.contains("show") ? 0 : 350);
});

if (matchMedia("(max-width: 720px)").matches) {
  S.view = { kind: "all" };
}
render();
</script>
</body>
</html>
